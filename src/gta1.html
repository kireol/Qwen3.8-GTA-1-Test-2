<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GRAND THEFT AUTO</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  body{font-family:"Arial Narrow",Arial,Helvetica,sans-serif;color:#fff;
       -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
  #ov{pointer-events:none}
  #boot{position:fixed;left:0;top:0;width:100%;height:100%;background:#050505;z-index:10;
        display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #boot .lg{font:900 96px/0.85 "Arial Black",Impact,sans-serif;color:#e01b1b;letter-spacing:-4px;
        text-shadow:0 4px 0 #6b0909,0 0 26px rgba(224,27,27,.45)}
  #boot .sub{margin-top:14px;font:700 13px/1 "Courier New",monospace;letter-spacing:5px;color:#8a8a8a}
  #boot .bar{margin-top:26px;width:280px;height:9px;border:1px solid #3a3a3a;background:#111}
  #boot .bar i{display:block;height:100%;width:0;background:#e01b1b;transition:width .18s}
  #boot .msg{margin-top:12px;font:700 11px/1 "Courier New",monospace;letter-spacing:2px;color:#5f5f5f}
  #boot.err .lg{color:#8a1414}
  #boot.err .msg{color:#d05050;white-space:pre-wrap;max-width:70%}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="boot"><div class="lg">GTA</div><div class="sub">GRAND THEFT AUTO</div>
<div class="bar"><i id="bl"></i></div><div class="msg" id="bm">BOOTING</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
(function(){
/* =====================================================================
   GRAND THEFT AUTO — single-file web remake
   Everything (geometry, textures, audio) is generated at runtime.
   Only external dependency: three.js r128 (cdnjs), loaded above.
   ===================================================================== */

var bootEl=document.getElementById('boot'),bootBar=document.getElementById('bl'),bootMsg=document.getElementById('bm');
function bootStep(p,m){bootBar.style.width=(p*100).toFixed(0)+'%';if(m)bootMsg.textContent=m;}
function bootFail(t){bootEl.className='boot err';bootEl.classList.add('err');bootMsg.textContent=t;}
if(!window.THREE){bootFail('three.js r128 could not be loaded from cdnjs — check your network connection.');return;}
bootStep(0.02,'GENERATING CITY');

/* ---------------------------------------------------------- math/util */
var TAU=Math.PI*2, DEG=Math.PI/180;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function sat(v){return v<0?0:(v>1?1:v);}
function smooth(t){return t*t*(3-2*t);}
function sgn(v){return v<0?-1:(v>0?1:0);}
function len2(x,y){return Math.sqrt(x*x+y*y);}
function angDiff(a,b){var d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function angLerp(a,b,t){return a+angDiff(b,a)*clamp(t,0,1);}
function dist2(ax,az,bx,bz){var dx=ax-bx,dz=az-bz;return Math.sqrt(dx*dx+dz*dz);}
function approach(cur,tgt,rate){var d=tgt-cur;if(Math.abs(d)<=rate)return tgt;return cur+sgn(d)*rate;}

/* seeded rng -> city layout identical on every reload */
function RNG(seed){
  var s=seed>>>0;
  function next(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;}
  var r={f:next,r:next,
    range:function(a,b){return a+(b-a)*next();},
    int:function(a,b){return Math.floor(a+(b-a+1)*next());},
    pick:function(arr){return arr[Math.floor(next()*arr.length)%arr.length];},
    chance:function(p){return next()<p;},
    sign:function(){return next()<0.5?-1:1;},
    reset:function(){s=seed>>>0;}};
  return r;
}

/* ------------------------------------------------------ canvas helpers */
function cvs(w,h){var c=document.createElement('canvas');c.width=w|0;c.height=(h||w)|0;return c;}
function ctx2(c){return c.getContext('2d');}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);
  g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}
/* grit / noise speckle */
function speckle(g,x,y,w,h,n,cols,a0,a1,rmin,rmax,seed){
  var rg=RNG(seed||1234);g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  for(var i=0;i<n;i++){var r=rg.range(rmin,rmax);
    g.fillStyle=cols[rg.int(0,cols.length-1)];g.globalAlpha=rg.range(a0,a1);
    g.beginPath();g.arc(rg.range(x,x+w),rg.range(y,y+h),r,0,TAU);g.fill();}
  g.restore();g.globalAlpha=1;
}
/* horizontal brick courses */
function brickCourses(g,x,y,w,h,coursePx,mortar,alpha){
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.globalAlpha=alpha;g.strokeStyle=mortar;g.lineWidth=1;
  var row=0;
  for(var yy=y;yy<y+h;yy+=coursePx){
    g.beginPath();g.moveTo(x,yy);g.lineTo(x+w,yy);g.stroke();
    var off=(row%2)*(coursePx*1.6);
    for(var xx=x+off;xx<x+w;xx+=coursePx*3.2){g.beginPath();g.moveTo(xx,yy);g.lineTo(xx,yy+coursePx);g.stroke();}
    row++;
  }
  g.restore();g.globalAlpha=1;
}
function vgrad(g,x,y,w,h,stops){
  var gr=g.createLinearGradient(x,y,x,y+h);
  for(var i=0;i<stops.length;i++)gr.addColorStop(stops[i][0],stops[i][1]);
  g.fillStyle=gr;g.fillRect(x,y,w,h);
}
function hgrad(g,x,y,w,h,stops){
  var gr=g.createLinearGradient(x,y,x+w,y);
  for(var i=0;i<stops.length;i++)gr.addColorStop(stops[i][0],stops[i][1]);
  g.fillStyle=gr;g.fillRect(x,y,w,h);
}

/* -------------------------------------------------- procedural texture atlas
   One 2048px page of 64 tiles (256px each). The whole static city samples
   this single texture, so the city renders in a handful of draw calls.
   Tiles that are "facade modules" map 1:1 onto a wall module by subdividing
   the wall, which keeps windows evenly scaled on every building.          */
var TSP=256, TCOUNT=8, ATLAS_PX=TSP*TCOUNT;
var T={/* ground */
  ASPHALT:0, ASPHALT2:1, SIDEWALK:2, SIDEWALK_TILE:3, GRASS:4, GRASS_MOW:5, DIRT:6,
  BRICK_ROUND:7, WATER:8, RAIL:9, PLATFORM:10, CONCRETE:11, STONE_PLAZA:12, OIL:13,
  GRAVEL:14, SAND:15,
  /* facades (module tiles) */
  BRICK_RED:16, BRICK_RED2:17, BRICK_BROWN:18, BRICK_BROWN2:19, APT_BLUE:20, APT_BLUE2:21,
  GLASS_GREY:22, GLASS_GREY2:23, GLASS_BLUE:24, GLASS_BLUE2:25, STONE_BANK:26, STONE_BANK2:27,
  SHOP_A:28, SHOP_B:29, WAREHOUSE:30, WAREHOUSE2:31, PANEL:32, PLASTER:33, GARAGE:34,
  /* roofs / props */
  ROOF_GRAVEL:35, ROOF_TAR:36, ROOF_METAL:37, LEAF:38, PALM:39, BILLBOARD:40, NEON:41,
  WOOD:42, METAL:43, CONTAINER:44, FENCE:45, ROCK:46, WHITE:47, HULL:48, WATERTOWER:49,
  POOL:50, BRICK_PLAIN:51, BLOCKWall:52, METAL_RIB:53, GLASS_LIT:54, PLAZA_DARK:55,
  ASPHALT_DARK:56, GRASS_DARK:57, TILE_NEON:58, CARGO:59, DOOR:60, CRATE:61, CONCRETE_BLK:62, SPARE:63};

/* meters represented by one facade module tile / one ground tile */
var MOD_W=3.4, MOD_H=3.4;
var GROUND_M={};GROUND_M[T.ASPHALT]=8;GROUND_M[T.ASPHALT2]=8;GROUND_M[T.SIDEWALK]=4;GROUND_M[T.SIDEWALK_TILE]=4;
GROUND_M[T.GRASS]=8;GROUND_M[T.GRASS_MOW]=8;GROUND_M[T.DIRT]=8;GROUND_M[T.BRICK_ROUND]=4;GROUND_M[T.WATER]=16;
GROUND_M[T.RAIL]=4;GROUND_M[T.PLATFORM]=4;GROUND_M[T.CONCRETE]=8;GROUND_M[T.STONE_PLAZA]=8;GROUND_M[T.OIL]=8;
GROUND_M[T.GRAVEL]=8;GROUND_M[T.SAND]=8;GROUND_M[T.ASPHALT_DARK]=8;GROUND_M[T.GRASS_DARK]=8;
GROUND_M[T.PLAZA_DARK]=8;GROUND_M[T.POOL]=4;GROUND_M[T.WAREHOUSE]=3.4;GROUND_M[T.TILE_NEON]=4;

var atlasCv=cvs(ATLAS_PX,ATLAS_PX), atlasG=ctx2(atlasCv);
atlasG.fillStyle='#000';atlasG.fillRect(0,0,ATLAS_PX,ATLAS_PX);
function tileXY(i){return [(i%TCOUNT)*TSP, ((i/TCOUNT)|0)*TSP];}
/* each painter draws into a fresh 256 canvas, blitted into its atlas slot */
function paintTile(idx,fn){
  var c=cvs(TSP,TSP),g=ctx2(c);g.save();fn(g,TSP);g.restore();
  var p=tileXY(idx);atlasG.drawImage(c,p[0],p[1]);
}
/* tile uv rect, inset by ~2 texels to stop mip bleed from the neighbour.
   CanvasTexture keeps flipY=true, so GL v runs bottom-up against the canvas:
   row 0 (top of the canvas) must map to the TOP of the v range. */
var ATLAS_TEXEL=1/ATLAS_PX;
function tileUV(i){
  var col=i%TCOUNT, row=(i/TCOUNT)|0;
  var x=col/TCOUNT, y=1-(row+1)/TCOUNT, s=1/TCOUNT, e=ATLAS_TEXEL*2.0;
  return [x+e, y+e, x+s-e, y+s-e];
}

/* --- ground ---------------------------------------------------------------- */
function tAsphalt(g,S,dark,cracks){
  var base=dark?'#2b2c2f':'#3b3d40', hi=dark?'#4a4c50':'#5c5f63';
  g.fillStyle=base;g.fillRect(0,0,S,S);
  speckle(g,0,0,S,S,4200,[hi,'#6b6e72','#212226','#54575b'],0.05,0.30,0.4,2.4,7);
  speckle(g,0,0,S,S,900,['#6f7276','#1b1c1f'],0.06,0.22,2,7,99);
  var rg=RNG(dark?71:23);g.lineCap='round';
  for(var i=0;i<(cracks?16:7);i++){
    var x=rg.range(0,S),y=rg.range(0,S);g.strokeStyle='rgba(20,20,22,'+rg.range(0.15,0.45).toFixed(2)+')';
    g.lineWidth=rg.range(0.6,2.2);g.beginPath();g.moveTo(x,y);
    for(var k=0;k<5;k++){x+=rg.range(-26,26);y+=rg.range(-26,26);g.lineTo(x,y);}g.stroke();
  }
  /* tar seam patch */
  if(cracks){g.fillStyle='rgba(18,18,20,.35)';rr(g,rg.range(10,120),rg.range(10,120),rg.range(60,140),rg.range(40,110),18);g.fill();}
}
paintTile(T.ASPHALT,function(g,S){tAsphalt(g,S,false,false);});
paintTile(T.ASPHALT2,function(g,S){tAsphalt(g,S,true,true);});
paintTile(T.ASPHALT_DARK,function(g,S){tAsphalt(g,S,true,false);});
paintTile(T.OIL,function(g,S){
  tAsphalt(g,S,false,false);var rg=RNG(5);
  for(var i=0;i<9;i++){var x=rg.range(20,236),y=rg.range(20,236),r=rg.range(12,48);
    var gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(6,6,8,.75)');gr.addColorStop(.6,'rgba(8,8,10,.4)');
    gr.addColorStop(1,'rgba(8,8,10,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
});
function tSlab(g,S,cols,joint,cw,rh,gritA){
  g.fillStyle=cols[0];g.fillRect(0,0,S,S);
  var rg=RNG(cw*7+rh*13);
  for(var y=0;y<S;y+=rh){for(var x=0;x<S;x+=cw){
    var o=rg.int(0,cols.length-1);g.fillStyle=cols[o];g.fillRect(x+1,y+1,cw-2,rh-2);}}
  g.strokeStyle=joint;g.lineWidth=1.4;
  for(var yy=0;yy<=S;yy+=rh){g.beginPath();g.moveTo(0,yy);g.lineTo(S,yy);g.stroke();}
  for(var xx=0;xx<=S;xx+=cw){g.beginPath();g.moveTo(xx,0);g.lineTo(xx,S);g.stroke();}
  speckle(g,0,0,S,S,2600,['#ffffff','#000000','#8d8d8d'],0.03,0.13,0.4,2.0,31);
}
paintTile(T.SIDEWALK,function(g,S){tSlab(g,S,['#9a9a95','#8e8e89','#a3a39d','#93938e'],'rgba(60,60,58,.55)',S/2,S/4,11);});
paintTile(T.SIDEWALK_TILE,function(g,S){tSlab(g,S,['#b3a99a','#a89e8f','#bdb3a4','#9e9486'],'rgba(70,62,54,.5)',S/4,S/4,9);});
paintTile(T.STONE_PLAZA,function(g,S){tSlab(g,S,['#b8b4a9','#a9a59a','#c2beb3','#9e9a90'],'rgba(80,76,70,.45)',S/3,S/3,8);});
paintTile(T.PLAZA_DARK,function(g,S){tSlab(g,S,['#6e6a66','#66625e','#767270','#5e5a56'],'rgba(30,28,26,.5)',S/3,S/3,7);});
paintTile(T.CONCRETE,function(g,S){
  g.fillStyle='#9c9c97';g.fillRect(0,0,S,S);
  vgrad(g,0,0,S,S,[[0,'rgba(255,255,255,.07)'],[1,'rgba(0,0,0,.14)']]);
  speckle(g,0,0,S,S,3200,['#fff','#000','#7f7f7b'],0.03,0.15,0.5,2.6,17);
  g.strokeStyle='rgba(70,70,68,.35)';g.lineWidth=1.5;
  g.beginPath();g.moveTo(0,S*0.5);g.lineTo(S,S*0.5);g.moveTo(S*0.33,0);g.lineTo(S*0.33,S);g.stroke();
});
var cols8=['#9b9c98','#93948f','#a2a39e','#8b8c88'];
paintTile(T.CONCRETE_BLK,function(g,S){
  g.fillStyle='#8f908c';g.fillRect(0,0,S,S);
  var bh=S/8,bw=S/4,rg=RNG(3);
  for(var r2=0;r2<8;r2++){var off=(r2%2)*bw*0.5;
    for(var c=-1;c<5;c++){var x=c*bw+off,y=r2*bh;
      g.fillStyle=cols8[rg.int(0,3)];g.fillRect(x+1.5,y+1.5,bw-3,bh-3);}}
  speckle(g,0,0,S,S,1800,['#fff','#000'],0.03,0.12,0.4,1.8,5);
});
paintTile(T.BRICK_ROUND,function(g,S){
  g.fillStyle='#8d4a38';g.fillRect(0,0,S,S);
  var bw=S/8,bh=S/4,rg=RNG(11);
  var cs=['#9c5340','#874634','#a05b45','#7d3f30','#94503c'];
  for(var r2=0;r2<8;r2++){
    for(var c=0;c<9;c++){
      var dir=(r2%2)?1:-1;
      var x=c*bw,y=r2*bh;
      g.save();g.translate(x+bw/2,y+bh/2);g.rotate(dir*0.785);
      g.fillStyle=cs[rg.int(0,4)];g.fillRect(-bw*0.72,-bh*0.40,bw*1.44,bh*0.80);
      g.strokeStyle='rgba(40,20,15,.35)';g.lineWidth=1;g.strokeRect(-bw*0.72,-bh*0.40,bw*1.44,bh*0.80);
      g.restore();
    }
  }
  speckle(g,0,0,S,S,1400,['#fff','#000'],0.02,0.10,0.4,1.6,21);
});
function tGrass(g,S,c1,c2,c3,stripes){
  g.fillStyle=c1;g.fillRect(0,0,S,S);
  var rg=RNG(19);
  for(var i=0;i<2600;i++){var x=rg.range(0,S),y=rg.range(0,S);
    g.strokeStyle=rg.chance(0.5)?c2:c3;g.globalAlpha=rg.range(0.18,0.62);g.lineWidth=rg.range(0.7,1.9);
    g.beginPath();g.moveTo(x,y);g.lineTo(x+rg.range(-1.4,1.4),y-rg.range(2,6));g.stroke();}
  g.globalAlpha=1;
  if(stripes){var rg2=RNG(88);g.globalAlpha=0.10;
    for(var s2=0;s2<4;s2++){g.fillStyle=(s2%2)?'#ffffff':'#000000';g.fillRect(0,s2*S/4,S,S/4);}g.globalAlpha=1;}
  speckle(g,0,0,S,S,500,['#20341a','#7d9a52'],0.05,0.16,0.5,2.2,3);
}
paintTile(T.GRASS,function(g,S){tGrass(g,S,'#4d6b32','#5f8039','#3e5827',false);});
paintTile(T.GRASS_DARK,function(g,S){tGrass(g,S,'#3c5427','#4a6630','#2f4420',false);});
paintTile(T.GRASS_MOW,function(g,S){tGrass(g,S,'#527135','#658840','#425c29',true);});
paintTile(T.DIRT,function(g,S){
  g.fillStyle='#8a7351';g.fillRect(0,0,S,S);
  speckle(g,0,0,S,S,4000,['#9c8461','#75603f','#a2906d','#6b583c'],0.06,0.30,0.5,2.6,44);
});
paintTile(T.SAND,function(g,S){
  g.fillStyle='#c9b487';g.fillRect(0,0,S,S);
  speckle(g,0,0,S,S,5000,['#e0cba0','#b09a70','#d6c197'],0.06,0.26,0.4,1.8,55);
});
paintTile(T.GRAVEL,function(g,S){
  g.fillStyle='#7d7a74';g.fillRect(0,0,S,S);
  var rg=RNG(66);
  for(var i=0;i<1800;i++){g.fillStyle=rg.chance(.5)?'#8f8c86':'#6a6762';g.globalAlpha=rg.range(.3,.8);
    g.beginPath();g.arc(rg.range(0,S),rg.range(0,S),rg.range(0.8,2.6),0,TAU);g.fill();}
  g.globalAlpha=1;
});
paintTile(T.WATER,function(g,S){
  g.fillStyle='#2f5c74';g.fillRect(0,0,S,S);
  var rg=RNG(77);
  for(var i=0;i<46;i++){var y=rg.range(0,S);
    g.strokeStyle=rg.chance(.5)?'rgba(150,205,225,.20)':'rgba(20,50,70,.24)';
    g.lineWidth=rg.range(1.5,7);g.beginPath();
    for(var x=0;x<=S;x+=16)g.lineTo(x,y+Math.sin((x/S)*TAU*rg.range(1,3)+i)*rg.range(2,7));
    g.stroke();}
  speckle(g,0,0,S,S,900,['#bfe6f2','#193f57'],0.04,0.14,0.5,2.4,12);
});
paintTile(T.POOL,function(g,S){
  g.fillStyle='#2fa8c4';g.fillRect(0,0,S,S);
  var rg=RNG(31);
  for(var i=0;i<26;i++){var y=rg.range(0,S);g.strokeStyle='rgba(230,255,255,.30)';g.lineWidth=rg.range(1,4);
    g.beginPath();for(var x=0;x<=S;x+=14)g.lineTo(x,y+Math.sin(x/S*TAU*2+i)*4);g.stroke();}
  g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=2;g.strokeRect(1,1,S-2,S-2);
});
paintTile(T.RAIL,function(g,S){
  g.fillStyle='#5d574d';g.fillRect(0,0,S,S);
  speckle(g,0,0,S,S,2200,['#6d6659','#4a453d','#7b7365'],0.10,0.4,0.6,2.2,29);
  var rg=RNG(91);g.fillStyle='#4a3a28';
  for(var y=8;y<S;y+=26){g.fillRect(S*0.14,y,S*0.72,11);}
  g.fillStyle='#3a2d1f';g.fillRect(S*0.14,0,4,S);g.fillRect(S*0.86-4,0,4,S);
  g.fillStyle='#c9c6bf';g.fillRect(S*0.30-3,0,6,S);g.fillStyle='#8d8a84';g.fillRect(S*0.30-3,0,2,S);
  g.fillStyle='#c9c6bf';g.fillRect(S*0.70-3,0,6,S);g.fillStyle='#8d8a84';g.fillRect(S*0.70-3,0,2,S);
});
paintTile(T.PLATFORM,function(g,S){
  tSlab(g,S,['#a7a49b','#9b988f','#b0ada4'],'rgba(60,58,54,.5)',S/2,S/2,10);
  g.fillStyle='#e0c33a';g.fillRect(0,S-20,S,9);
  speckle(g,0,S-20,S,9,300,['#8a7a20'],0.2,0.5,0.5,1.5,8);
});
paintTile(T.CRATE,function(g,S){
  g.fillStyle='#9d7642';g.fillRect(0,0,S,S);
  var rg=RNG(123);g.strokeStyle='rgba(60,40,18,.5)';g.lineWidth=2;
  for(var y=0;y<S;y+=S/6){g.fillStyle=rg.chance(.5)?'#a87f47':'#8f6c3c';g.fillRect(0,y,S,S/6-2);}
  g.strokeRect(4,4,S-8,S-8);g.beginPath();g.moveTo(4,4);g.lineTo(S-4,S-4);g.moveTo(S-4,4);g.lineTo(4,S-4);g.stroke();

/* one window: dark glass, frame, reflection, sometimes lit / AC / blinds */
function windowHole(g,x,y,w,h,opt){
  opt=opt||{};
  var rg=opt.rng||RNG(1);
  g.fillStyle=opt.frame||'rgba(228,228,222,.92)';
  g.fillRect(x-2,y-2,w+4,h+4);
  g.fillStyle='rgba(24,28,34,.96)';g.fillRect(x,y,w,h);
  if(opt.lit){
    var gr=g.createLinearGradient(x,y+h,x,y);
    gr.addColorStop(0,'rgba(255,214,140,.95)');gr.addColorStop(1,'rgba(226,160,86,.55)');
    g.fillStyle=gr;g.fillRect(x,y,w,h);
    g.fillStyle='rgba(60,40,20,.35)';for(var i=1;i<3;i++)g.fillRect(x,y+h*i/3,w,2);
  }else{
    var g2=g.createLinearGradient(x,y,x+w,y+h);
    g2.addColorStop(0,'rgba(150,190,215,.42)');g2.addColorStop(.45,'rgba(90,120,150,.10)');
    g2.addColorStop(.55,'rgba(200,225,240,.30)');g2.addColorStop(1,'rgba(60,80,100,.06)');
    g.fillStyle=g2;g.fillRect(x,y,w,h);
  }
  if(opt.mull!==false){g.fillStyle=opt.frame||'rgba(226,226,220,.85)';
    g.fillRect(x+w/2-1.5,y,3,h);if(opt.mullV!==false)g.fillRect(x,y+h*0.34,w,2.5);}
  /* sill */
  g.fillStyle='rgba(210,210,202,.85)';g.fillRect(x-5,y+h+2,w+10,5);
  g.fillStyle='rgba(0,0,0,.22)';g.fillRect(x-5,y+h+7,w+10,3);
  if(opt.ac){g.fillStyle='#b9bcc0';g.fillRect(x+w*0.58,y+h*0.55,w*0.42,h*0.4);
    g.fillStyle='#7e8286';g.fillRect(x+w*0.60,y+h*0.58,w*0.38,h*0.12);
    g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x+w*0.58,y+h*0.95,w*0.42,3);}
  if(opt.blinds){g.fillStyle='rgba(210,205,190,.5)';for(var b=0;b<h;b+=6)g.fillRect(x,y+b,w,3);}
}
function doorHole(g,x,y,w,h,rg){
  g.fillStyle='rgba(20,20,24,.9)';g.fillRect(x,y,w,h);

function facadeApartment(g,S,o){
  wallBase(g,S,o.wall,o.brick||o.wall,o.brickA||0.28);
  var rg=o.rng;
  var wx=S*0.20,ww=S*0.60,wy=S*0.22,wh=S*0.44;
  windowHole(g,wx,wy,ww,wh,{rng:rg,lit:o.lit,frame:o.frame,ac:rg.chance(0.22),blinds:rg.chance(0.25)});
  if(o.balcony){
    g.fillStyle='rgba(30,32,34,.85)';g.fillRect(S*0.10,S*0.70,S*0.80,S*0.055);
    g.fillStyle='rgba(60,64,66,.9)';g.fillRect(S*0.10,S*0.58,S*0.80,4);
    for(var i=0;i<=10;i++){g.fillRect(S*0.10+i*(S*0.80/10),S*0.58,2.5,S*0.12);}
    g.fillStyle='rgba(0,0,0,.25)';g.fillRect(S*0.10,S*0.755,S*0.80,5);
  }
  if(o.door)doorHole(g,S*0.34,S*0.74,S*0.30,S*0.26,rg);
  /* grime from sills */
  g.globalAlpha=.10;g.fillStyle='#000';g.fillRect(wx-4,wy+wh+9,ww+8,S*0.12);g.globalAlpha=1;
  vgrad(g,0,0,S,S,[[0,'rgba(255,255,255,.05)'],[.7,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.12)']]);
}

function facadeStone(g,S,rg,c1,c2,dark){

  g.strokeStyle='rgba(0,0,0,.20)';g.lineWidth=2;
  for(var y=0;y<S;y+=S/5){g.beginPath();g.moveTo(0,y);g.lineTo(S,y);g.stroke();
    for(var x=(y%(S/2.5))?S/4:S/2;x<S;x+=S/2){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+S/5);g.stroke();}}
  /* tall arched window */
  var wx=S*0.24,ww=S*0.52,wy=S*0.20,wh=S*0.52;
  g.fillStyle='rgba(20,22,26,.94)';rr(g,wx,wy+ww/2,ww,wh-ww/2,0);g.fill();
  g.beginPath();g.arc(wx+ww/2,wy+ww/2,ww/2,Math.PI,0);g.fill();
  var gr=g.createLinearGradient(wx,wy+wh,wx+ww,wy);
  gr.addColorStop(0,'rgba(120,150,170,.30)');gr.addColorStop(.5,'rgba(220,235,245,.18)');gr.addColorStop(1,'rgba(60,80,95,.06)');
  g.fillStyle=gr;rr(g,wx,wy+ww/2,ww,wh-ww/2,0);g.fill();
  g.beginPath();g.arc(wx+ww/2,wy+ww/2,ww/2,Math.PI,0);g.fill();
  g.fillStyle=c1;g.fillRect(wx-4,wy+ww/2-3,ww+8,6);
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(wx-8,wy+wh+3,ww+16,7);

  hgrad(g,0,0,S*0.10,S,[[0,'rgba(255,255,255,.14)'],[1,'rgba(0,0,0,.14)']]);
  hgrad(g,S*0.90,0,S*0.10,S,[[0,'rgba(255,255,255,.14)'],[1,'rgba(0,0,0,.14)']]);
}

var SND=(function(){
  var ac=null,master=null,voices={},enabled=true,noiseBuf=null,muted=false;
  function ctxOf(){
    if(ac)return ac;
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
    ac=new AC();master=ac.createGain();master.gain.value=0.75;master.connect(ac.destination);
    var n=ac.sampleRate*1.2;nBuf=ac.createBuffer(1,n,ac.sampleRate);
    var d=nBuf.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
    return ac;
  }
  var nBuf=null;
  function resume(){var a=ctxOf();if(a&&a.state==='suspended')a.resume();}
  function noise(dur,vol,f0,f1,q,type){
    var a=ctxOf();if(!a||muted)return;
    var s=a.createBufferSource();s.buffer=nBuf;s.playbackRate.value=1;
    var f=a.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=f0;f.Q.value=q||1;
    if(f1)f.frequency.linearRampToValueAtTime(Math.max(40,f1),a.currentTime+dur);
    var g=a.createGain();g.gain.value=vol;g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008,a.currentTime+dur);
    s.connect(f);f.connect(g);g.connect(master);s.start();s.stop(a.currentTime+dur+0.02);
  }
  function tone(freq,dur,vol,type,f2,detune){
    var a=ctxOf();if(!a||muted)return;
    var o=a.createOscillator();o.type=type||'square';o.frequency.value=freq;
    if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),a.currentTime+dur);
    var g=a.createGain();g.gain.value=0;g.gain.setValueAtTime(0,a.currentTime);
    g.gain.linearRampToValueAtTime(vol,a.currentTime+0.008);
    g.gain.exponentialRampToValueAtTime(0.0008,a.currentTime+dur);
    o.connect(g);g.connect(master);o.start();o.stop(a.currentTime+dur+0.02);
  }
  /* looping engine voice per slot id */
  function engine(id,speed01,load){
    var a=ctxOf();if(!a)return;
    var v=voices[id];
    if(!v){
      if(muted)return;
      v=voices[id]={};
      v.o1=a.createOscillator();v.o1.type='sawtooth';
      v.o2=a.createOscillator();v.o2.type='square';
      v.f=a.createBiquadFilter();v.f.type='lowpass';v.f.frequency.value=420;v.f.Q.value=3;
      v.g=a.createGain();v.g.gain.value=0;
      v.o1.connect(v.f);v.o2.connect(v.f);v.f.connect(v.g);v.g.connect(master);
      v.o1.start();v.o2.start();
    }
    if(muted){if(v)v.g.gain.value=0;return;}
    var t=a.currentTime,rpm=44+speed01*130+(load||0)*18;
    v.o1.frequency.setTargetAtTime(rpm,t,0.08);
    v.o2.frequency.setTargetAtTime(rpm*0.5,t,0.08);
    v.f.frequency.setTargetAtTime(300+speed01*1500,t,0.1);
    v.g.gain.setTargetAtTime(0.028+speed01*0.05+(load||0)*0.02,t,0.12);
  }

    var v=voices[id];if(!v)return;var a=ctxOf();
    try{v.g.gain.setTargetAtTime(0,a.currentTime,0.08);v.o1.stop(a.currentTime+0.3);v.o2.stop(a.currentTime+0.3);}catch(e){}
    delete voices[id];
  }

    resume:resume,
    setMute:function(m){muted=m;if(m){for(var k in voices)engineStop(k);}},
    isMute:function(){return muted;},
    gunshot:function(kind){
      if(kind==='shotgun'){noise(0.30,0.55,2600,300,1.2);tone(90,0.16,0.30,'square',40);}
      else if(kind==='uzi'){noise(0.085,0.30,3400,900,1.5);tone(150,0.05,0.14,'square',60);}
      else if(kind==='rocket'){noise(0.5,0.42,900,120,1);tone(70,0.4,0.25,'sawtooth',30);}
      else{noise(0.13,0.40,3000,600,1.3);tone(120,0.09,0.20,'square',50);}
    },
    crash:function(v){noise(0.34,0.42*(v||1),1500,180,0.9);tone(60,0.2,0.22*(v||1),'square',28);},
    scrape:function(){noise(0.16,0.10,2400,1200,6);},
    skid:function(v){noise(0.22,0.12*(v||1),1800,700,3);},
    pickup:function(){tone(880,0.09,0.16,'square',1320);tone(1320,0.10,0.12,'square',1760);},
    cash:function(){tone(1180,0.07,0.13,'triangle');setTimeout(function(){tone(1560,0.10,0.12,'triangle');},55);},
    hurt:function(){noise(0.18,0.30,700,200,1);tone(180,0.14,0.16,'sawtooth',80);},
    thud:function(){noise(0.14,0.26,320,90,1.2);},
    siren:function(two){
      var a=ctxOf();if(!a||muted)return;
      if(a.currentTime-lastSiren<0.30)return;lastSiren=a.currentTime;
      tone(two?660:520,0.26,0.10,'sine',two?900:760);
    },
    horn:function(){tone(320,0.24,0.10,'square');tone(400,0.24,0.07,'square');},
    boom:function(){

      noise(0.35,0.30,180,50,1.5);
    },

    start:function(){tone(392,0.16,0.20,'square');setTimeout(function(){tone(523,0.16,0.20,'square');},130);

    fail:function(){tone(220,0.22,0.22,'sawtooth');setTimeout(function(){tone(165,0.30,0.22,'sawtooth',110);},180);},

/* =====================================================================
   GEOMETRY  —  accumulate triangles into flat arrays.
   The city is a grid, so every static primitive is axis aligned; only
   props need yaw. Static geometry is bucketed into map tiles so the
   renderer can frustum-cull the parts of the city that are off screen.
   Colours are per-vertex, which is what buys fake AO / grime gradients
   and lets every painted prop share a single untextured draw call.
   ===================================================================== */

function cmul3(c,k1,k2,k3){return [c[0]*k1,c[1]*k2,c[2]*(k3===undefined?k1:k3)];}
function cmix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function cshade(c,k,ky,kz){ /* face shading: side faces get slight tint */
  return [c[0]*(ky===undefined?k:ky),c[1]*k,c[2]*(kz===undefined?k:kz)];
}

    var l=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;nx/=l;ny/=l;nz/=l;

  this.n.push(nx,ny,nz,nx,ny,nz,nx,ny,nz);

  this.c.push(c0[0],c0[1],c0[2],c1[0],c1[1],c1[2],c2[0],c2[1],c2[2]);

/* quad a,b,c,d counter-clockwise seen from its normal; uv rect; per-corner cols */
Builder.prototype.quad=function(ax,ay,az,bx,by,bz,cx,cy,cz,dx,dy,dz,uvr,col){
  var u0=uvr[0],v0=uvr[1],u1=uvr[2],v1=uvr[3],cc=cols4(col);
  this.tri(ax,ay,az,bx,by,bz,cx,cy,cz,u0,v0,u1,v0,u1,v1,cc[0],cc[1],cc[2]);
  this.tri(ax,ay,az,cx,cy,cz,dx,dy,dz,u0,v0,u1,v1,u0,v1,cc[0],cc[2],cc[3]);
};
/* flat horizontal quad, normal +Y, ccw from above */
Builder.prototype.gq=function(x1,z1,x2,z2,y,uvr,col){
  var cc=cols4(col);

/* vertical wall on plane z=const, spanning x1..x2, height y0..y1. dir=+1 -> +Z */
Builder.prototype.wallZ=function(z,x1,x2,y0,y1,dir,uvr,cb,ct){
  var u0=uvr[0],u1=uvr[2],v0=uvr[1],v1=uvr[3];ct=ct||cb;
  if(dir>0){
    this.tri(x1,y0,z, x2,y0,z, x2,y1,z, u0,v0,u1,v0,u1,v1, cb,cb,ct);
    this.tri(x1,y0,z, x2,y1,z, x1,y1,z, u0,v0,u1,v1,u0,v1, cb,ct,ct);

    this.tri(x2,y0,z, x1,y0,z, x1,y1,z, u0,v0,u1,v0,u1,v1, cb,cb,ct);

};
/* vertical wall on plane x=const, spanning z1..z2, height y0..y1. dir=+1 -> +X */
Builder.prototype.wallX=function(x,z1,z2,y0,y1,dir,uvr,cb,ct){
  var u0=uvr[0],u1=uvr[2],v0=uvr[1],v1=uvr[3];ct=ct||cb;

    this.tri(x,y0,z2, x,y0,z1, x,y1,z1, u0,v0,u1,v0,u1,v1, cb,cb,ct);
    this.tri(x,y0,z2, x,y1,z1, x,y1,z2, u0,v0,u1,v1,u0,v1, cb,ct,ct);

    this.tri(x,y0,z1, x,y0,z2, x,y1,z2, u0,v0,u1,v0,u1,v1, cb,cb,ct);

/* closed axis-aligned block (4 walls + top). cb/ct: bottom & top vertex colours */
Builder.prototype.box=function(x1,z1,x2,z2,y0,y1,uvr,cb,ct){
  ct=ct||cb;
  this.wallZ(z2,x1,x2,y0,y1,+1,uvr,cb,ct);
  this.wallZ(z1,x1,x2,y0,y1,-1,uvr,cb,ct);
  this.wallX(x2,z1,z2,y0,y1,+1,uvr,cb,ct);
  this.wallX(x1,z1,z2,y0,y1,-1,uvr,cb,ct);

Builder.prototype.build=function(){
  var g=new THREE.BufferGeometry();

  g.setAttribute('normal',new THREE.Float32BufferAttribute(this.n,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(this.u,2));

};

/* ---- higher level static primitives ------------------------------------- */

/* quad with a *desired* normal; winding is auto-corrected so callers never
   have to think about vertex order (used for rotated / angled surfaces) */
Builder.prototype.qn=function(ax,ay,az,bx,by,bz,cx,cy,cz,dx,dy,dz,uvr,col,nx,ny,nz){
  var ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;
  var fx=uy*vz-uz*vy,fy=uz*vx-ux*vz,fz=ux*vy-uy*vx;
  var u0=uvr[0],v0=uvr[1],u1=uvr[2],v1=uvr[3],cc=cols4(col);
  if(fx*nx+fy*ny+fz*nz<0){ /* flip: swap b<->d corners and their uv */
    this.tri(ax,ay,az,dx,dy,dz,cx,cy,cz,u0,v0,u0,v1,u1,v1,cc[0],cc[3],cc[2]);
    this.tri(ax,ay,az,cx,cy,cz,bx,by,bz,u0,v0,u1,v1,u1,v0,cc[0],cc[2],cc[1]);
  }else{
    this.tri(ax,ay,az,bx,by,bz,cx,cy,cz,u0,v0,u1,v0,u1,v1,cc[0],cc[1],cc[2]);
    this.tri(ax,ay,az,cx,cy,cz,dx,dy,dz,u0,v0,u1,v1,u0,v1,cc[0],cc[2],cc[3]);
  }
};
/* horizontal ground quad of arbitrary shape (rotated strip) */
Builder.prototype.strip=function(x1,z1,x2,z2,w,y,uvr,col){
  var dx=x2-x1,dz=z2-z1,l=len2(dx,dz)||1;dx/=l;dz/=l;
  var px=-dz*w*0.5,pz=dx*w*0.5;
  this.qn(x1+px,y,z1+pz, x2+px,y,z2+pz, x2-px,y,z2-pz, x1-px,y,z1-pz, uvr,col,0,1,0);
};
/* ground area auto-subdivided so each atlas tile keeps its metre scale.
   col may be a single colour or 4 per-corner colours (baked AO). */
Builder.prototype.fill=function(x1,z1,x2,z2,y,tile,col,opt){
  var m=(opt&&opt.m)||GROUND_M[tile]||8,uv=tileUV(tile);
  var nx=Math.max(1,Math.round((x2-x1)/m)),nz=Math.max(1,Math.round((z2-z1)/m));
  var dx=(x2-x1)/nx,dz=(z2-z1)/nz,rng=opt&&opt.rng,jit=opt&&opt.jit||0;
  for(var i=0;i<nx;i++)for(var j=0;j<nz;j++){
    var cx=x1+i*dx,cz=z1+j*dz,c=col;
    if(rng&&jit){var k=1+rng.range(-jit,jit);c=[col[0]*k,col[1]*k,col[2]*k];}
    if(rng&&jit&&rng.chance(0.14))c=[col[0]*0.93,col[1]*0.93,col[2]*0.9];
    this.gq(cx,cz,cx+dx,cz+dz,y,uv,c);
  }
};
/* tiled facade wall: wall is cut into `floors` x `mods` quads, each mapping to
   one whole module tile -> windows stay correctly scaled on every building */
Builder.prototype.facade=function(axis,p,a1,a2,y0,H,dir,tile,floors,mods,cb,ct){
  floors=Math.max(1,Math.round(floors));mods=Math.max(1,Math.round(mods));
  var fh=H/floors,aw=(a2-a1)/mods,uv=tileUV(tile);
  for(var f=0;f<floors;f++){
    var by=y0+f*fh,ty=by+fh;
    var t=floors>1?f/(floors-1):1;
    var lo=cmix(cb,ct,0.55*t*t),hi=cmix(cb,ct,0.30+0.70*t);
    for(var m=0;m<mods;m++){
      var s=a1+m*aw;
      if(axis==='z')this.wallZ(p,s,s+aw,by,ty,dir,uv,lo,hi);
      else this.wallX(p,s,s+aw,by,ty,dir,uv,lo,hi);
    }
  }
};
/* extrude a closed XZ polygon between two heights (optionally tapering to a
   second ring). Normals and winding are derived per edge from the centroid, so
   the caller never has to reason about vertex order. */
Builder.prototype.extrudeP=function(pts0,y0,pts1,y1,uvr,cb,ct,opt){
  opt=opt||{};ct=ct||cb;
  var n=pts0.length,i;
  if(!pts1){pts1=[];for(i=0;i<n;i++)pts1.push(pts0[i]);}
  var cx=0,cz=0;for(i=0;i<n;i++){cx+=pts0[i][0];cz+=pts0[i][1];}cx/=n;cz/=n;
  for(i=0;i<n;i++){
    var a=pts0[i],b=pts0[(i+1)%n],a2=pts1[i],b2=pts1[(i+1)%n];
    var ex=b[0]-a[0],ez=b[1]-a[1],l=len2(ex,ez)||1;
    var nx=ez/l,nz=-ex/l;
    var mx=(a[0]+b[0])*0.5-cx,mz=(a[1]+b[1])*0.5-cz;
    if(nx*mx+nz*mz<0){
      nx=-nx;nz=-nz;
      this.tri(a[0],y0,a[1], b[0],y0,b[1], b2[0],y1,b2[1], uvr[0],uvr[1],uvr[2],uvr[1],uvr[2],uvr[3],cb,cb,ct,nx,0,nz);
      this.tri(a[0],y0,a[1], b2[0],y1,b2[1], a2[0],y1,a2[1], uvr[0],uvr[1],uvr[2],uvr[3],uvr[0],uvr[3],cb,ct,ct,nx,0,nz);
    }else{
      this.tri(b[0],y0,b[1], a[0],y0,a[1], a2[0],y1,a2[1], uvr[0],uvr[1],uvr[2],uvr[1],uvr[2],uvr[3],cb,cb,ct,nx,0,nz);
      this.tri(b[0],y0,b[1], a2[0],y1,a2[1], b2[0],y1,b2[1], uvr[0],uvr[1],uvr[2],uvr[3],uvr[0],uvr[3],cb,ct,ct,nx,0,nz);
    }
  }
  this.fan(pts1,y1,uvr,ct,true);
  if(opt.bottom)this.fan(pts0,y0,uvr,cmul(cb,0.62),false);
};
Builder.prototype.extrude=function(pts,y0,y1,uvr,cb,ct,opt){
  this.extrudeP(pts,y0,null,y1,uvr,cb,ct,opt);
};
Builder.prototype.ringPts=function(cx,cz,r,seg){
  var pts=[],i;
  for(i=0;i<seg;i++){var a=i/seg*TAU;pts.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r]);}
  return pts;
};
/* ring at r0/y0 -> ring at r1/y1. r1<r0 gives a taper, r1 tiny gives a cone */
Builder.prototype.tube=function(cx,cz,y0,r0,y1,r1,seg,cb,ct,uvr,cap){
  var p0=this.ringPts(cx,cz,r0,seg),p1=r1>0.02?this.ringPts(cx,cz,r1,seg):null;
  this.extrudeP(p0,y0,p1,y1,uvr||tileUV(T.METAL),cb,ct,{});
  if(cap!==false)this.fan(p1||p0,y1,tileUV(T.GRAVEL),ct||cb,true);
};
/* horizontal n-gon cap; up=true -> normal +Y */
Builder.prototype.fan=function(pts,y,uvr,col,up){
  var n=pts.length,cx=0,cz=0,i;
  for(i=0;i<n;i++){cx+=pts[i][0];cz+=pts[i][1];}cx/=n;cz/=n;
  var nyv=up?1:-1;
  for(i=0;i<n;i++){
    var a=pts[i],b=pts[(i+1)%n];
    /* auto-correct winding against the desired normal */
    var ux=a[0]-cx,uz=a[1]-cz,vx=b[0]-cx,vz=b[1]-cz;
    var cr=uz*vx-ux*vz;                       /* y component of (a-c)x(b-c) */
    if(cr*nyv<0){var t=a;a=b;b=t;}
    this.tri(cx,y,cz, a[0],y,a[1], b[0],y,b[1], uvr[0],uvr[1],uvr[2],uvr[1],uvr[2],uvr[3], col,col,col, 0,nyv,0);
  }
};
Builder.prototype.cyl=function(cx,cz,y0,h,r,seg,cb,ct,uvr,capTop){
  var pts=[],i;
  for(i=0;i<seg;i++){var a=i/seg*TAU;pts.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r]);}
  this.extrude(pts,y0,y0+h,uvr||tileUV(T.METAL),cb,ct,{bottom:false});
  if(capTop!==false)this.fan(pts,y0+h,tileUV(T.GRAVEL),ct||cb,true);
};
Builder.prototype.cone=function(cx,cz,y0,h,r,seg,cb,ct){
  this.tube(cx,cz,y0,r,y0+h,0.012,seg,cb,ct,null,false);
  this.fan(this.ringPts(cx,cz,r,seg),y0,tileUV(T.GRAVEL),cmul(cb,0.7),false);
};
Builder.prototype.pole=function(cx,cz,y0,h,r,col,seg){
  this.cyl(cx,cz,y0,h,r,seg||6,col,cmul(col,1.18),tileUV(T.METAL),true);
};

/* ------------------------------------------------------- collision world */
function Colliders(cell){
  this.cell=cell||24;this.rects=[];this.grid={};
  this._a=[];this._b=[];   /* scratch buffers; _a and _b never conflict */
}
Colliders.prototype.add=function(x1,z1,x2,z2,h,kind){
  var i=this.rects.length;
  this.rects.push({x1:x1,z1:z1,x2:x2,z2:z2,h:h||3,kind:kind||'wall'});
  var c=this.cell,gx0=Math.floor(x1/c),gx1=Math.floor(x2/c),gz0=Math.floor(z1/c),gz1=Math.floor(z2/c);
  for(var gx=gx0;gx<=gx1;gx++)for(var gz=gz0;gz<=gz1;gz++){
    var k=gx+','+gz;(this.grid[k]||(this.grid[k]=[])).push(i);
  }
  return i;
};
Colliders.prototype.near=function(x,z,r,out){
  out=out||this._a;out.length=0;
  var c=this.cell,gx0=Math.floor((x-r)/c),gx1=Math.floor((x+r)/c),gz0=Math.floor((z-r)/c),gz1=Math.floor((z+r)/c);
  for(var gx=gx0;gx<=gx1;gx++)for(var gz=gz0;gz<=gz1;gz++){
    var a=this.grid[gx+','+gz];if(!a)continue;
    for(var i=0;i<a.length;i++)if(out.indexOf(a[i])<0)out.push(a[i]);
  }
  return out;
};
/* push a circle out of solid rects. returns 1 if it hit something. */
Colliders.prototype.resolve=function(o,r){
  var list=this.near(o.x,o.z,r+2,this._a),hit=0,i;
  for(i=0;i<list.length;i++){
    var R=this.rects[list[i]];
    if(R.kind==='trigger')continue;
    if(o.y>R.h)continue;
    var cx=clamp(o.x,R.x1,R.x2),cz=clamp(o.z,R.z1,R.z2);
    var dx=o.x-cx,dz=o.z-cz,d=dx*dx+dz*dz;
    if(d>r*r)continue;
    hit=1;
    if(d>1e-8){
      d=Math.sqrt(d);var p=r-d;o.x+=dx/d*p;o.z+=dz/d*p;
      if(o.nvx!==undefined){var dot=o.nvx*dx/d+o.nvz*dz/d;if(dot<0){o.nvx-=dx/d*dot;o.nvz-=dz/d*dot;}}
      o.hitNx=dx/d;o.hitNz=dz/d;o.hitR=R;
    }else{
      /* centre inside the rect: eject along the shallowest axis */
      var l=o.x-R.x1,r2=R.x2-o.x,t=o.z-R.z1,b=R.z2-o.z,m=Math.min(l,r2,t,b);
      if(m===l){o.x=R.x1-r;o.hitNx=-1;o.hitNz=0;}
      else if(m===r2){o.x=R.x2+r;o.hitNx=1;o.hitNz=0;}
      else if(m===t){o.z=R.z1-r;o.hitNx=0;o.hitNz=-1;}
      else{o.z=R.z2+r;o.hitNx=0;o.hitNz=1;}
    }
  }
  return hit;
};
Colliders.prototype.blocked=function(x,z,h,m){
  var list=this.near(x,z,1.2,this._b);m=m||0;h=h||1.7;
  for(var i=0;i<list.length;i++){var R=this.rects[list[i]];
    if(R.kind==='trigger')continue;
    if(h>R.h)continue;
    if(x>R.x1-m&&x<R.x2+m&&z>R.z1-m&&z<R.z2+m)return true;}
  return false;
};
Colliders.prototype.groundH=function(x,z){
  var list=this.near(x,z,0.6,this._b),h=0;
  for(var i=0;i<list.length;i++){var R=this.rects[list[i]];
    if(x>R.x1&&x<R.x2&&z>R.z1&&z<R.z2&&R.h>h&&R.kind!=='trigger')h=R.h;}
  return h;
};

var CFG={
  BLOCK:46, ROAD:13, SW:3.6, FLOOR:3.4,

CFG.STRIDE=CFG.BLOCK+CFG.ROAD;                 /* 59 between street centres */
CFG.R0=-CFG.ROAD/2; CFG.R1=CFG.ROAD/2;         /* road band, street-local */
CFG.LANE=CFG.ROAD/4;                           /* one of four lanes */
CFG.LOT0=CFG.R1+CFG.SW;                        /* lot min, block-local */
CFG.LOT1=CFG.STRIDE-CFG.R1-CFG.SW;             /* lot max */
CFG.WX=CFG.NX*CFG.STRIDE+CFG.R0;               /* world box: [R0,WX]x[R0,WZ] */
CFG.WZ=CFG.NZ*CFG.STRIDE+CFG.R0;
CFG.OT=function(t){return t*CFG.STRIDE;};
CFG.MIN=function(t){return t*CFG.STRIDE+CFG.R0;};           /* tile bounds */
CFG.MAX=function(t){return (t+1)*CFG.STRIDE+CFG.R0;};
CFG.CT=function(t){return t*CFG.STRIDE+(CFG.LOT0+CFG.LOT1)*0.5;}; /* lot centre */
CFG.LOTW=CFG.LOT1-CFG.LOT0;                                 /* 38.8 */
CFG.TX=function(x){return clamp(Math.floor((x-CFG.R0)/CFG.STRIDE),0,CFG.NX-1);};
CFG.TZ=function(z){return clamp(Math.floor((z-CFG.R0)/CFG.STRIDE),0,CFG.NZ-1);};
CFG.LANE_OFF=[-1.5*CFG.LANE,-0.5*CFG.LANE,0.5*CFG.LANE,1.5*CFG.LANE];
CFG.PITCHY=Math.sin(CFG.PITCH*DEG)*CFG.DIST;   /* camera height  45.9 */

var GL=document.getElementById('gl'),OV=document.getElementById('ov');

  scene=new THREE.Scene();

  scene.fog=new THREE.Fog(0x9fb0c4,180,540);
  var a=new THREE.CanvasTexture(atlasCv);
  a.magFilter=THREE.LinearFilter;
  a.minFilter=THREE.LinearMipmapLinearFilter;
  a.generateMipmaps=true;
  try{a.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());}catch(e){}
  matCity=new THREE.MeshLambertMaterial({map:a,vertexColors:THREE.VertexColors});
  matProp=new THREE.MeshLambertMaterial({vertexColors:THREE.VertexColors});
  matCut =new THREE.MeshLambertMaterial({map:a,vertexColors:THREE.VertexColors,

  matWater=new THREE.MeshLambertMaterial({map:waterTex,vertexColors:THREE.VertexColors});

    depthWrite:false});
  matHalo=new THREE.MeshBasicMaterial({map:spr('smoke'),transparent:true,depthWrite:false,
    blending:THREE.AdditiveBlending,side:THREE.DoubleSide,color:0xffffff});
  matGlow=new THREE.MeshBasicMaterial({map:spr('dot'),transparent:true,depthWrite:false,

  OV.width=innerWidth;OV.height=innerHeight;
  initLights();
  addEventListener('resize',onResize);

/* copy one atlas tile out into its own seamless, repeatable texture */
function atlasTileTex(idx){
  var p=tileXY(idx),c=cvs(TSP,TSP),g=ctx2(c);
  g.drawImage(atlasCv,p[0],p[1],TSP,TSP,0,0,TSP,TSP);
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.magFilter=THREE.LinearFilter;
  t.minFilter=THREE.LinearMipmapLinearFilter;
  try{t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());}catch(e){}
  return t;
}
var OX=OV.getContext('2d');
function onResize(){
  var w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();

  OV.style.width=w+'px';OV.style.height=h+'px';

}

/* ------------------------------------------------- static geometry buckets
   Static city geometry is merged per atlas-material kind, then split again per
   59x59 map tile so distant neighbourhoods get frustum-culled. */
var TB={};                      /* per-tile builders */
var BLD=null;                   /* current target for city/prop/cut */
function tileB(bx,bz){
  var k=bx+'|'+bz,t=TB[k];
  if(!t){t=TB[k]={bx:bx,bz:bz,city:new Builder(),prop:new Builder(),cut:new Builder(),
                   extra:new Builder(),water:new Builder()};}
  return t;
}

function meshOf(b,mat){
  var n=b.n?b.n.length:0;
  if(!n)return null;
  var g=b.build();
  var m=new THREE.Mesh(g,mat);
  m.matrixAutoUpdate=false;m.frustumCulled=false;m.updateMatrix();
  return m;
}
function statMesh(t,b,mat,bx,bz){
  if(!b.p.length)return null;
  var g=b.build();
  g.computeBoundingBox();
  var bb=g.boundingBox,c=new THREE.Vector3(),sz=new THREE.Vector3();
  bb.getCenter(c);g.boundingSphere=new THREE.Sphere(c,bb.getSize(sz).length()*0.5);
  var m=new THREE.Mesh(g,mat);
  m.matrixAutoUpdate=false;m.updateMatrix();
  m.renderOrder=(mat===matCut)?2:(mat===matAO?1:0);
  return m;
}

             statMesh(t,t.cut,matCut),statMesh(t,t.extra,matAO),
             statMesh(t,t.water,matWater)];

var ROAD_Y=0, SIDE_Y=0.15, LOT_Y=0.17, DET_Y=0.2, WATER_Y=-0.5;
var CL={};
function col(h){
  if(typeof h==='string')h=parseInt(h.replace('#',''),16);
  return CL[h]||(CL[h]=C(h));

var WHITE=col(0xffffff);
var K={kerb:col(0x9d9f99),stone:col(0xbdb8ab),line:col(0xe6e6dc),yl:col(0xcfa93a),
       conc:col(0xaaa9a0),steel:col(0x969aa0),iron:col(0x45484d),tar:col(0x303234),
       leaf:col(0x4e7a3a),trunk:col(0x5a4630),glass:col(0x7f96a8)};

function kindAt(bx,bz){
  if(bx<0||bz<0||bx>=CFG.NX||bz>=CFG.NZ)return 'void';
  return CITY.kind[bz*CFG.NX+bx];
}
function isW(bx,bz){return kindAt(bx,bz)==='water';}
function setK(bx,bz,k){if(bx>=0&&bz>=0&&bx<CFG.NX&&bz<CFG.NZ)CITY.kind[bz*CFG.NX+bx]=k;}
function lotBox(bx,bz){
  var ox=CFG.OT(bx),oz=CFG.OT(bz);
  return {bx:bx,bz:bz,x0:ox+CFG.LOT0,z0:oz+CFG.LOT0,x1:ox+CFG.LOT1,z1:oz+CFG.LOT1,
          ox:ox,oz:oz,sx0:ox+CFG.R1,sz0:oz+CFG.R1,sx1:CFG.MAX(bx),sz1:CFG.MAX(bz),
          cx:CFG.CT(bx),cz:CFG.CT(bz),w:CFG.LOTW,d:CFG.LOTW};
}
/* flat painted quad (uses the atlas WHITE tile so vertex colour is the paint) */
function flat(x1,z1,x2,z2,y,c,tile){
  if(x2<x1){var t=x1;x1=x2;x2=t;}
  if(z2<z1){t=z1;z1=z2;z2=t;}
  BLD.gq(x1,z1,x2,z2,y,tileUV(tile===undefined?T.WHITE:tile),c);
}
function waterArea(x1,z1,x2,z2,y,c){
  eachTile(x1,z1,x2,z2,function(i,j,a,b,cc,d){
    inTile((a+cc)*0.5,(b+d)*0.5).water.gq(a,b,cc,d,y,
      [a*0.0625,b*0.0625,cc*0.0625,d*0.0625],c||WHITE);
  });
}

/* --------------------------------------------------------- block kinds */
function pickKinds(ti){
  var rng=RNG(9007+ti*337),nx=CFG.NX,nz=CFG.NZ,i,j,k,r,cen;
  var parks=ti===1?[[2,5],[8,2],[5,4]]:[[2,4],[8,4],[1,2]];
  CITY.kind=[];
  for(j=0;j<nz;j++)for(i=0;i<nx;i++){
    k=null;
    if(i>=nx-1)k='water';
    else if(i===nx-2)k='front';
    else if(j===0){
      if(i>=2&&i<=4)k='station';
      else k=(i%2===0)?'ware':'rail';
    }
    else if(i<=1&&j<=2&&ti!==2)k='ware';
    else{
      cen=Math.max(Math.abs(i-5)/4.4,Math.abs(j-3.2)/2.6);
      r=rng.f();
      if(cen<0.3)k=r<0.74?'tower':'office';
      else if(cen<0.62)k=r<0.22?'office':r<0.34?'tower':r<0.46?'lot':'apt';
      else k=r<0.13?'lot':r<0.27?'shop':r<0.34?'garage':r<0.40?'plaza':'apt';
    }
    setK(i,j,k);
  }
  /* civic core + parks + a couple of green wedges */
  setK(4,3,'bank');setK(5,2,'plaza');setK(6,4,'office');
  for(i=0;i<parks.length;i++){
    var p=parks[i];
    if(kindAt(p[0],p[1])!=='water'&&kindAt(p[0],p[1])!=='front')setK(p[0],p[1],'park');
  }
  if(ti===2){setK(7,5,'neon');setK(8,5,'neon');setK(6,5,'neon');}
  if(ti===1){setK(9,3,'garage');setK(3,5,'park');}
  /* districts: voronoi over seeded names */
  var sd=[],n=Math.min(7,TH.districts.length);
  for(i=0;i<n;i++)sd.push([rng.range(-0.5,nx),rng.range(-0.5,nz)]);
  CITY.dist=[];
  for(j=0;j<nz;j++)for(i=0;i<nx;i++){
    var bi=0,bd=1e9;
    for(var s=0;s<n;s++){var dx=i-sd[s][0],dz=j-sd[s][1],d2=dx*dx+dz*dz;
      if(d2<bd){bd=d2;bi=s;}}
    CITY.dist[j*nx+i]=TH.districts[bi];
  }
  CITY.streets=[];
  for(i=0;i<nx;i++)CITY.streets.push(TH.streets[i%TH.streets.length]);
}

/* ------------------------------------------------------------ ground */
function lotGround(k,rng){
  switch(k){
    case 'park':   return [T.GRASS,col(0xf2f5e8),0.05];
    case 'plaza':  return [T.STONE_PLAZA,WHITE,0.04];
    case 'lot':    return [T.ASPHALT_DARK,col(0xf2f2f2),0.05];
    case 'garage': return [T.ASPHALT_DARK,col(0xf2f2f2),0.05];
    case 'front':  return [T.STONE_PLAZA,WHITE,0.04];
    case 'ware':   return [T.CONCRETE,col(0xf3f3ef),0.06];
    case 'rail':case 'station': return [T.GRAVEL,col(0xf0efe6),0.07];
    case 'neon':   return [T.PLAZA_DARK,col(0xf5f0f5),0.05];
    default:       return [T.CONCRETE,col(0xf0efe9),0.05];
  }
}
function groundTile(bx,bz){
  var k=kindAt(bx,bz);
  if(k==='water'){seaTile(bx,bz);return;}
  if(k==='void')return;
  var L=lotBox(bx,bz),tx0=CFG.MIN(bx),tx1=CFG.MAX(bx),tz0=CFG.MIN(bz),tz1=CFG.MAX(bz);
  var rng=RNG(bx*131+bz*977+CITY.theme*7919);
  setTile(bx,bz);
  var asph=rng.chance(0.26)?T.ASPHALT2:T.ASPHALT;
  /* west street band (full tile height) then south band east of it */
  gfill(tx0,tz0,L.sx0,tz1,ROAD_Y,asph,WHITE,{rng:rng,jit:0.07});
  gfill(L.sx0,tz0,tx1,L.sz0,ROAD_Y,asph,WHITE,{rng:rng,jit:0.07});
  /* kerb + pavement plate */
  gfill(L.sx0,L.sz0,tx1,tz1,SIDE_Y,T.SIDEWALK,col(0xf4f4f0),{rng:rng,jit:0.05});
  kerbRing(L);
  var gt=lotGround(k,rng);
  gfill(L.x0,L.z0,L.x1,L.z1,LOT_Y,gt[0],gt[1],{rng:rng,jit:gt[2]});
  /* kerb cuts (driveways) get painted over later by the lot builder */
  if(isW(bx+1,bz))seawall('x',tx1,L.sz0,tz1,+1);
  if(isW(bx-1,bz))seawall('x',tx0,L.sz0,tz1,-1);
  if(isW(bx,bz+1))seawall('z',tz1,L.sx0,tx1,+1);
  if(isW(bx,bz-1))seawall('z',tz0,L.sx0,tx1,-1);
}
function kerbRing(L){
  setTile(L.bx,L.bz);
  var u=tileUV(T.STONE_PLAZA),c0=cmul(K.kerb,0.86),c1=cmul(K.kerb,1.02);
  gwallX(L.sx0,L.sz0,L.sz1,-0.02,SIDE_Y,-1,u,c0,c1);
  gwallX(L.sx1,L.sz0,L.sz1,-0.02,SIDE_Y,+1,u,c0,c1);
  gwallZ(L.sz0,L.sx0,L.sx1,-0.02,SIDE_Y,-1,u,c0,c1);
  gwallZ(L.sz1,L.sx0,L.sx1,-0.02,SIDE_Y,+1,u,c0,c1);
}
function seaTile(bx,bz){
  var tx0=CFG.MIN(bx),tx1=CFG.MAX(bx),tz0=CFG.MIN(bz),tz1=CFG.MAX(bz);
  waterArea(tx0-1.5,tz0-1.5,tx1+1.5,tz1+1.5,WATER_Y,WHITE);
  CITY.marks.push({t:'sea',x:(tx0+tx1)*0.5,z:(tz0+tz1)*0.5});
}
function seawall(axis,p,a1,a2,dir){
  var t=inTile(axis==='x'?p:(a1+a2)*0.5,axis==='x'?(a1+a2)*0.5:p);
  BLD=t.city;
  var u=tileUV(T.STONE_PLAZA),c0=col(0x7f7c73),c1=col(0x9a968b);
  if(axis==='x')gbox(p-0.5,a1,p+0.5,a2,WATER_Y-0.6,SIDE_Y+0.03,u,c0,c1);
  else gbox(a1,p-0.5,a2,p+0.5,WATER_Y-0.6,SIDE_Y+0.03,u,c0,c1);
  CITY.C.add(axis==='x'?p-0.5:a1,axis==='x'?a1:p-0.5,
             axis==='x'?p+0.5:a2,axis==='x'?a2:p+0.5,2.5,'wall');
}

/* --------------------------------------------------------- road paint */
function segOpen(axis,gx,gz){
  /* does the road continue into the neighbouring block? */
  if(axis==='v')return !isW(gx,gz)&&!isW(gx,gz-1);
  return !isW(gx,gz)&&!isW(gx-1,gz);
}
function markV(x,z0,z1,gx,gz){
  setTile(gx,gz);
  var y=ROAD_Y+0.012,z;
  flat(x-0.36,z0,x-0.16,z1,y,K.yl);flat(x+0.16,z0,x+0.36,z1,y,K.yl);
  for(z=Math.ceil(z0/6)*6;z+2.4<z1;z+=6){
    flat(x-CFG.LANE-0.09,z,x-CFG.LANE+0.09,z+2.4,y,K.line);
    flat(x+CFG.LANE-0.09,z,x+CFG.LANE+0.09,z+2.4,y,K.line);
  }
  flat(x-CFG.R1+0.42,z0,x-CFG.R1+0.26,z1,y,col(0xd8d8ce));
  flat(x+CFG.R1-0.26,z0,x+CFG.R1-0.42,z1,y,col(0xd8d8ce));
}
function markH(z,x0,x1,gx,gz){
  setTile(gx,gz);
  var y=ROAD_Y+0.012,x;
  flat(x0,z-0.36,x1,z-0.16,y,K.yl);flat(x0,z+0.16,x1,z+0.36,y,K.yl);
  for(x=Math.ceil(x0/6)*6;x+2.4<x1;x+=6){
    flat(x,z-CFG.LANE-0.09,x+2.4,z-CFG.LANE+0.09,y,K.line);
    flat(x,z+CFG.LANE-0.09,x+2.4,z+CFG.LANE+0.09,y,K.line);
  }
  flat(x0,z-CFG.R1+0.42,x1,z-CFG.R1+0.26,y,col(0xd8d8ce));
  flat(x0,z+CFG.R1-0.26,x1,z+CFG.R1-0.42,y,col(0xd8d8ce));
}
function roadMarkings(){
  var gx,gz,R=CFG.R1*0.5+1.0;
  for(gx=0;gx<CFG.NX;gx++)for(gz=1;gz<CFG.NZ;gz++){
    if(!segOpen('v',gx,gz))continue;
    markV(CFG.OT(gx),CFG.OT(gz-1)+R,CFG.OT(gz)-R,gx,gz-1);
  }
  for(gz=0;gz<CFG.NZ;gz++)for(gx=1;gx<CFG.NX;gx++){
    if(!segOpen('h',gx,gz))continue;
    markH(CFG.OT(gz),CFG.OT(gx-1)+R,CFG.OT(gx)-R,gx-1,gz);
  }
}
function zebraV(x,zc,gx,gz){          /* crossing over a N-S road */
  setTile(gx,gz);
  var y=ROAD_Y+0.014;
  for(var i=0;i<7;i++){
    var z=zc-1.6+i*0.52;
    flat(x-CFG.R1+0.7,z,x+CFG.R1-0.7,z+0.3,y,K.line);
  }
}
function zebraH(z,xc,gx,gz){
  setTile(gx,gz);
  var y=ROAD_Y+0.014;
  for(var i=0;i<7;i++){
    var x=xc-1.6+i*0.52;
    flat(x,z-CFG.R1+0.7,x+0.3,z+CFG.R1-0.7,y,K.line);
  }
}
function junctions(){
  for(var gz=0;gz<CFG.NZ;gz++)for(var gx=0;gx<CFG.NX;gx++){
    if(isW(gx,gz))continue;
    var x=CFG.OT(gx),z=CFG.OT(gz),R=CFG.R1;
    var n=!isW(gx,gz-1)&&gz>0,s=!isW(gx,gz+1)&&gz<CFG.NZ-1;
    var w=!isW(gx-1,gz)&&gx>0,e=!isW(gx+1,gz)&&gx<CFG.NX-1;
    var rg=RNG(gx*31+gz*53+11);
    if((gx+gz)%2===0||rg.chance(0.3)){
      if(n)zebraV(x,z-R-2.6,gx,gz-1);
      if(s)zebraV(x,z+R+2.6,gx,gz);
      if(w)zebraH(z,x-R-2.6,gx-1,gz);
      if(e)zebraH(z,x+R+2.6,gx,gz);
    }
    if((gx+gz)%2===0){
      trafficLight(x-R-0.9,z-R-0.9,+1,gx,gz);
      trafficLight(x+R+0.9,z+R+0.9,-1,gx,gz);
    }
    if(rg.chance(0.3))streetSign(x+R+0.9,z-R-0.9,rg);
  }
}

function lampPost(x,z,bx,bz,armDir){
  BLD=inTile(x,z).city;
  var g=cmul(K.steel,0.62),dk=cmul(K.steel,0.42);
  gtube(x,z,SIDE_Y,0.13,6.2,0.055,6,dk,g,null,false);

/* ------------------------------------------------------------ assemble */
function clearWorld(){
  for(var i=0;i<staticMeshes.length;i++){
    var m=staticMeshes[i];
    worldRoot.remove(m);
    if(m.geometry)m.geometry.dispose();
  }
  staticMeshes.length=0;
}
function buildCity(ti){
  applyTheme(THEMES[ti]||THEMES[0]);
  if(!worldRoot){worldRoot=new THREE.Group();scene.add(worldRoot);}
  CITY.theme=ti;CITY.marks=[];CITY.plots=[];CITY.spawn=[];CITY.glow=[];
  CITY.C=new Colliders(24);
  /* keep actors on the island: walls just inside the drawn kerb skirt */
  var EB=CFG.R0-3.2,EX=CFG.WX+3.2,EZ=CFG.WZ+3.2;
  CITY.C.add(EB-1.2,EB-1.2,EB,EZ+1.2,3.2,'wall');
  CITY.C.add(EX,EB-1.2,EX+1.2,EZ+1.2,3.2,'wall');
  CITY.C.add(EB-1.2,EZ,EX+1.2,EZ+1.2,3.2,'wall');
  CITY.C.add(EB-1.2,EB-1.2,EX+1.2,EB,3.2,'wall');
  clearWorld();
  TB={};
  pickKinds(ti);
  var bx,bz;
  for(bz=0;bz<CFG.NZ;bz++)for(bx=0;bx<CFG.NX;bx++)groundTile(bx,bz);
  roadMarkings();
  junctions();
  for(bz=0;bz<CFG.NZ;bz++)for(bx=0;bx<CFG.NX;bx++){
    var k=kindAt(bx,bz);
    if(k==='water'||k==='void')continue;
    lotBuild(lotBox(bx,bz),k,RNG(bx*2267+bz*9001+ti*131));
  }
  furnTiles();
  /* keep traffic inside the map */
  CITY.C.add(CFG.R0-1,CFG.R0-1,CFG.R0+0.6,CFG.WZ+1,4,'wall');
  CITY.C.add(CFG.WX-0.6,CFG.R0-1,CFG.WX+1,CFG.WZ+1,4,'wall');
  CITY.C.add(CFG.R0-1,CFG.R0-1,CFG.WX+1,CFG.R0+0.6,4,'wall');
  CITY.C.add(CFG.R0-1,CFG.WZ-0.6,CFG.WX+1,CFG.WZ+1,4,'wall');
  flushStatics();
}

function fenceRun(x1,z1,x2,z2,hgt,rng){

/* =========================================================== building kit
   mass() emits a fully dressed volume: tiled facade modules on all four
   faces, a roof plate, a parapet, baked contact shading and a collider. */
function mass(x0,z0,x1,z1,y0,H,tile,cb,ct,rng,roofTile,noParapet){
  var w=x1-x0,d=z1-z0;
  var floors=Math.max(1,Math.round(H/CFG.FLOOR));
  var mA=Math.max(1,Math.round(w/MOD_W)),mC=Math.max(1,Math.round(d/MOD_W));
  useCity((x0+x1)*0.5,(z0+z1)*0.5);
  gfacade('z',z1,x0,x1,y0,H,+1,tile,floors,mA,cb,ct);
  gfacade('z',z0,x0,x1,y0,H,-1,tile,floors,mA,cb,ct);
  gfacade('x',x1,z0,z1,y0,H,+1,tile,floors,mC,cb,ct);
  gfacade('x',x0,z0,z1,y0,H,-1,tile,floors,mC,cb,ct);
  var ry=y0+H;
  gfill(x0,z0,x1,z1,ry,roofTile===undefined?TH.roof[rng.int(0,TH.roof.length-1)]:roofTile,
        WHITE,{rng:rng,jit:0.05});
  if(!noParapet&&H>2.5){
    var pt=0.32,ph=0.62,pw=cmix(cb,WHITE,0.22),pd=cmix(cb,col(0x000000),0.35);
    gbox(x0,z0,x1,z0+pt,ry,ry+ph,tileUV(T.BLOCKWall),pd,pw);
    gbox(x0,z1-pt,x1,z1,ry,ry+ph,tileUV(T.BLOCKWall),pd,pw);
    gbox(x0,z0+pt,x0+pt,z1-pt,ry,ry+ph,tileUV(T.BLOCKWall),pd,pw);
    gbox(x1-pt,z0+pt,x1,z1-pt,ry,ry+ph,tileUV(T.BLOCKWall),pd,pw);
  }
  aoSkirt(x0,z0,x1,z1,1.5+Math.min(3.0,H*0.05),cmul(col(0x000000),0.42*TH.grime+0.18));
  CITY.C.add(x0,z0,x1,z1,y0+H,'building');
  return ry;
}
function roofKit(x0,z0,x1,z1,ry,rng,dense){
  var u=tileUV(T.METAL_RIB),st=col(0x7b8087),dk=col(0x4d5157);
  var iw=x1-x0-1.6,id=z1-z0-1.6;
  if(iw<2||id<2)return;
  useCity((x0+x1)*0.5,(z0+z1)*0.5);
  /* stair housing */
  if(rng.chance(0.9)){
    var sw=rng.range(1.8,3.0),sd=rng.range(1.6,2.6);
    var sx=x0+0.9+rng.f()*(iw-sw),sz=z0+0.9+rng.f()*(id-sd);
    gbox(sx,sz,sx+sw,sz+sd,ry,ry+2.3,tileUV(T.CONCRETE_BLK),col(0x77786f),col(0x9d9e95));
    gbox(sx+0.15,sz-0.06,sx+sw-0.15,sz+0.06,ry+0.05,ry+1.05,tileUV(T.DOOR),col(0x4d5157),col(0x6a6f76));
  }
  /* AC condensers */
  var n=rng.int(dense?2:1,dense?5:3);
  for(var i=0;i<n;i++){
    var ax=x0+1.1+rng.f()*(iw-2.2),az=z0+1.1+rng.f()*(id-2.2);
    var aw=rng.range(0.9,1.6);
    gbox(ax-aw*0.5,az-aw*0.5,ax+aw*0.5,az+aw*0.5,ry,ry+0.72,u,cmul(st,0.7),st);
    gcyl(ax,az,ry+0.72,0.14,aw*0.34,8,dk,cmul(st,0.9),tileUV(T.METAL),true);
  }
  /* vent ducts + pipes */
  for(i=0;i<rng.int(1,3);i++){
    var px0=x0+1.2+rng.f()*(iw-2.4),pz0=z0+1.2+rng.f()*(id-2.4);
    var ln=rng.range(1.6,Math.min(4.4,iw)),horiz=rng.chance(0.5);
    if(horiz)gcyl(px0,pz0,ry+0.28,ln,0.2,6,cmul(st,0.8),st,tileUV(T.METAL),true);
    else gcyl(px0,pz0,ry+0.28,ln,0.2,6,cmul(st,0.8),st,tileUV(T.METAL),true);
    gcyl(horiz?px0+ln:px0,horiz?pz0:pz0+ln,ry+0.1,0.3,0.24,6,dk,st,tileUV(T.METAL),true);
  }
  /* water tank on older blocks */
  if(rng.chance(0.34)&&iw>7&&id>7){
    var tx=x0+iw*0.5+ (rng.f()-0.5)*iw*0.3,tz=z0+id*0.5+(rng.f()-0.5)*id*0.3,tr=rng.range(1.1,1.7);
    for(var q=0;q<4;q++){
      var a=q/4*TAU+0.78;
      gtube(tx+Math.cos(a)*tr*1.15,tz+Math.sin(a)*tr*1.15,ry,0.09,ry+1.7,0.07,4,dk,st,null,false);
    }
    gcyl(tx,tz,ry+1.7,1.5,tr,10,col(0x8b6a44),col(0xa88458),tileUV(T.WATERTOWER),false);
    gcone(tx,tz,ry+3.2,0.85,tr*1.04,10,col(0x6d5238),col(0x8a6a48));
    gstrip(tx-tr,tz,tx+tr,tz,0.07,ry+2.5,tileUV(T.METAL),dk);
  }
  /* TV antenna mast, with a blinking aviation light at night */
  if(rng.chance(0.4)){
    var ax2=x0+1.4+rng.f()*(iw-2.8),az2=z0+1.4+rng.f()*(id-2.8),mh=rng.range(1.8,4.2);
    gpole(ax2,az2,ry,mh,0.05,4,dk);
    for(q=0;q<3;q++){
      var yy=ry+mh*(0.45+q*0.18),ww=mh*0.18*(3-q);
      gstrip(ax2-ww,az2,ax2+ww,az2,0.04,yy,tileUV(T.METAL),dk);
      gstrip(ax2,az2-ww,ax2,az2+ww,0.04,yy,tileUV(T.METAL),dk);
    }
    if(TH.night)glowAt(ax2,ry+mh+0.1,az2,1.5,0xff3030);
  }
}

/* ------------------------------------------------------- facade details
   Face ids: 0 = -Z wall, 1 = +X, 2 = +Z, 3 = -X. faceInfo() gives the plane,
   the along-face span and the outward normal, so every wall-mounted detail
   below is written once instead of four times. */
function faceInfo(x0,z0,x1,z1,face){
  if(face===0||face===2)
    return {axis:'z',p:face===0?z0:z1,a0:x0,a1:x1,ox:0,oz:face===0?-1:1};
  return {axis:'x',p:face===3?x0:x1,a0:z0,a1:z1,ox:face===3?-1:1,oz:0};
}
function faceBox(f,ua,ub,y0,y1,depth,uvr,cb,ct){
  if(ua>ub){var t=ua;ua=ub;ub=t;}
  if(f.axis==='z'){
    var za=f.p,zb=f.p+f.oz*depth;
    gbox(ua,Math.min(za,zb),ub,Math.max(za,zb),y0,y1,uvr,cb,ct);
  }else{
    var xa=f.p,xb=f.p+f.ox*depth;
    gbox(Math.min(xa,xb),ua,Math.max(xa,xb),ub,y0,y1,uvr,cb,ct);
  }
}
function faceQuad(f,ua,ub,y0,y1,depth,uvr,cb,ct){
  if(ua>ub){var t=ua;ua=ub;ub=t;}
  if(f.axis==='z')gwallZ(f.p+f.oz*depth,ua,ub,y0,y1,f.oz,uvr,cb,ct);
  else gwallX(f.p+f.ox*depth,ua,ub,y0,y1,f.ox,uvr,cb,ct);
}
function entrance(x,z,face,w,rng,big){
  useCity(x,z);
  var H=big?3.4:2.5,ww=w||2.2;
  var f=(face===0||face===2)
    ? {axis:'z',p:z,a0:x-ww*0.5,a1:x+ww*0.5,ox:0,oz:face===0?-1:1}
    : {axis:'x',p:x,a0:z-ww*0.5,a1:z+ww*0.5,ox:face===3?-1:1,oz:0};
  var a0=f.a0,a1=f.a1;
  faceBox(f,a0,a1,LOT_Y,LOT_Y+H,0.28,tileUV(T.DOOR),col(0x242930),col(0x454e59));
  /* surround + canopy */
  faceBox(f,a0-0.42,a0-0.06,LOT_Y,LOT_Y+H+0.35,0.42,tileUV(T.STONE_BANK),col(0x87837a),col(0xb0aca0));
  faceBox(f,a1+0.06,a1+0.42,LOT_Y,LOT_Y+H+0.35,0.42,tileUV(T.STONE_BANK),col(0x87837a),col(0xb0aca0));
  faceBox(f,a0-0.42,a1+0.42,LOT_Y+H+0.05,LOT_Y+H+0.45,0.5,tileUV(T.STONE_BANK),col(0x7d7970),col(0xa8a498));
  faceBox(f,a0-0.75,a1+0.75,LOT_Y+H*0.86,LOT_Y+H*0.92,1.15,tileUV(T.METAL),col(0x363b42),col(0x596069));
  faceBox(f,a0-0.75,a1+0.75,LOT_Y+H*0.92,LOT_Y+H*0.95,1.15,tileUV(T.METAL),col(0x5d646d),col(0x7e8792));
  if(big){
    var n=4;
    for(var i=0;i<n;i++){
      var d=0.55+i*0.5,y=LOT_Y+(n-i)*0.14;
      faceBox(f,a0-0.9-i*0.2,a1+0.9+i*0.2,LOT_Y-0.02,y,d,tileUV(T.STONE_PLAZA),col(0x8b8a82),col(0xb4b3a9));
    }
  }
  if(TH.night||TH.neon>0.4){
    var lc=col(0xffe6b0),lx=x+f.ox*0.9,lz=z+f.oz*0.9;
    flat(lx-0.12,lz-0.12,lx+0.12,lz+0.12,LOT_Y+H*0.8,lc,T.WHITE);
    glowAt(lx,LOT_Y+H*0.8,lz,3.0,0xffdf9e);
  }
}
function cornice(f,y0,depth,uvr,cb,ct){

function fireEscape(x0,z0,x1,z1,face,floors,rng){
  var f=faceInfo(x0,z0,x1,z1,face);
  useCity((x0+x1)*0.5,(z0+z1)*0.5);
  var st=col(0x474b50),dk=col(0x2f3236);
  var n=Math.min(floors-1,rng.int(3,6));
  var d=0.95;
  for(var i=0;i<n;i++){
    var y=LOT_Y+CFG.FLOOR*(i+1)-0.3;
    faceBox(f,f.a0+1.0,f.a1-1.0,y,y+0.12,d,UV1,st,cmul(st,1.25));
    faceBox(f,f.a0+1.0,f.a1-1.0,y+0.12,y+0.95,d-0.06,UV1,dk,cmul(st,0.85)); /* guard rail */
    faceBox(f,f.a0+1.0,f.a0+1.2,y,y+0.95,d,UV1,dk,st);
    faceBox(f,f.a1-1.2,f.a1-1.0,y,y+0.95,d,UV1,dk,st);
    if(i<n-1)faceBox(f,f.a1-2.0,f.a1-1.1,y-CFG.FLOOR+0.2,y+0.06,d*0.75,UV1,dk,st);
  }
  /* drop ladder */
  faceBox(f,f.a0+1.3,f.a0+1.7,LOT_Y,LOT_Y+CFG.FLOOR-0.3,d*0.8,UV1,dk,st);
}
/* striped shop awning, hinged at the wall and drooping over the pavement */
function awning(x0,z0,x1,z1,face,yTop,len,c1,c2,stripes){
  var f=faceInfo(x0,z0,x1,z1,face);
  useCity((x0+x1)*0.5,(z0+z1)*0.5);
  var n=stripes||8,a0=f.a0+0.25,a1=f.a1-0.25;
  var y0=yTop,y1=yTop-0.55;
  var ux=(f.axis==='z'?0:f.ox),uz=(f.axis==='z'?f.oz:0);
  var wp=f.p,op=f.p+(f.axis==='z'?f.oz:f.ox)*len;
  for(var i=0;i<n;i++){
    var s0=a0+(a1-a0)*i/n,s1=a0+(a1-a0)*(i+1)/n;
    var c=(i%2)?c1:c2,ca=cmul(c,0.78),cbn=(i%2)?cmul(c1,0.86):cmul(c2,0.86);
    var ax,az,bx,bz,cx,cz,dx2,dz2;
    if(f.axis==='z'){ax=s0;az=wp;bx=s1;bz=wp;cx=s1;cz=op;dx2=s0;dz2=op;}
    else{ax=wp;az=s0;bx=wp;bz=s1;cx=op;cz=s1;dx2=op;dz2=s0;}
    gqn(ax,y0,az,bx,y0,bz,cx,y1,cz,dx2,y1,dz2,UV1,[c,cbn,cbn,c],ux*0.6,1,uz*0.6);
    /* underside, darker */
    gqn(ax,y0-0.03,az,bx,y0-0.03,bz,cx,y1-0.03,cz,dx2,y1-0.03,dz2,UV1,
        [ca,ca,ca,ca],-ux*0.6,-1,-uz*0.6);
  }
  /* valance hangs off the outer edge, brackets brace it to the wall */
  faceBox(f,a0,a1,y1-0.34,y1,len,UV1,c2,cmul(c2,0.82));
  faceBox(f,a0,a0+0.1,y1,yTop,0.05+len*0.85,UV1,col(0x3a3d42),col(0x585c62));
  faceBox(f,a1-0.1,a1,y1,yTop,0.05+len*0.85,UV1,col(0x3a3d42),col(0x585c62));
}
/* shop sign band across the whole frontage */
function signBand(x0,z0,x1,z1,face,y0,h,rg,neon){
  var f=faceInfo(x0,z0,x1,z1,face);
  useCity((x0+x1)*0.5,(z0+z1)*0.5);
  faceBox(f,f.a0+0.05,f.a1-0.05,y0,y0+h,0.22,tileUV(T.SHOP_B),col(0x2b3038),col(0x464d58));
  var n=rg.int(3,6),pal=[0xd4463a,0x2f7fb8,0xd9a028,0x3f9b4a,0x8a4fa8,0xd8641e,0x2fb0a0];
  for(var i=0;i<n;i++){
    var s0=f.a0+0.5+(f.a1-f.a0-1.0)*i/n,s1=f.a0+0.5+(f.a1-f.a0-1.0)*(i+1)/n;
    if(s1-s0<0.5)continue;
    var c=col(pal[rg.int(0,pal.length-1)]);
    faceBox(f,s0+0.15,s1-0.15,y0+0.18,y0+h-0.18,0.34,UV1,cmul(c,0.78),c);
    if(neon&&TH.neon>0.3&&rg.chance(0.55)){
      var nc=col(rg.chance(0.5)?0xff4fa8:0x4fd8ff),mu=(s0+s1)*0.5;
      faceBox(f,s0+0.3,s1-0.3,y0+h-0.3,y0+h-0.14,0.42,UV1,nc,nc);
      if(f.axis==='z')glowAt(mu,y0+h-0.2,f.p+f.oz*0.5,3.2,nc);
      else glowAt(f.p+f.ox*0.5,y0+h-0.2,mu,3.2,nc);
    }
  }
}
/* =========================================================== lot kit
   One builder per block kind. Each emits geometry through the prop/building
   kit (every helper pins its own bucket), registers its colliders, and leaves
   spawn points behind: parked cars, pedestrian starts and mission plots. */
function parkedAt(x,z,yaw,k){CITY.spawn.push({t:'p',x:x,z:z,yaw:yaw,k:k||0});}
function pedAt(x,z){CITY.spawn.push({t:'d',x:x,z:z});}
function rankAt(x,z,yaw){CITY.spawn.push({t:'rank',x:x,z:z,yaw:yaw});}
function plotAt(t,x,z,L){

}
function pedRing(L,n,rng){
  for(var i=0;i<n;i++){
    var f=rng.int(0,3),t=rng.range(0.12,0.88);
    if(f===0)pedAt(L.sx0+(L.sx1-L.sx0)*t,L.sz0+1.4);
    else if(f===2)pedAt(L.sx0+(L.sx1-L.sx0)*t,L.sz1-1.4);
    else if(f===3)pedAt(L.sx0+1.4,L.sz0+(L.sz1-L.sz0)*t);
    else pedAt(L.sx1-1.4,L.sz0+(L.sz1-L.sz0)*t);

function kerbProps(L,rng){

function fTile(rng,pool){pool=pool||TH.facade;return pool[rng.int(0,pool.length-1)];}
function tintFor(rng,cool){

function cenF(L){return Math.max(Math.abs(L.bx-5)/4.4,Math.abs(L.bz-3.2)/2.6);}
/* rooftop advertising panel: atlas billboard tile on a cut-out quad + frame */
function billboard(x,z,alongX,rng,w,h,yBase){
  var hw=w*0.5,ph=h||3.2,y0=(yBase===undefined?LOT_Y+3.6:yBase);
  useCut(x,z);
  var e=tileUV(T.BILLBOARD),ad=cmix(WHITE,col(0xffffff),0);
  if(alongX){
    gwallZ(z,x-hw,x+hw,y0,y0+ph,+1,e,[ad[0]*0.86,ad[1]*0.86,ad[2]*0.86],ad);
    gwallZ(z,x-hw,x+hw,y0,y0+ph,-1,e,[ad[0]*0.7,ad[1]*0.7,ad[2]*0.7],ad);
  }else{

/* simple docked boat: stacked tapered hull, cabin, mast */

function pierAt(x,z,axis,len,rng){
  var w=3.4,l=len||rng.range(8,16),ca=(axis==='x');
  var hx=ca?l*0.5:w*0.5,hz=ca?w*0.5:l*0.5,px=x+hx,pz=z+hz;
  useCity(x,z);
  gbox(x-hx,z-hz,x+hx,z+hz,WATER_Y+0.72,WATER_Y+0.86,tileUV(T.WOOD),
       col(0x6a5a44),col(0x9c8a6c));
  var n=Math.max(2,Math.round(l/2.6));
  for(var i=0;i<=n;i++){
    var t=i/n,ax=x-2*hx*t,hz2=0;
    var qx=ca?x-hx+2*hx*t:x,qz=ca?z:z-hz+2*hz*t;
    for(var s=-1;s<=1;s+=2){
      var ox=ca?0:s*w*0.42,oz=ca?s*w*0.42:0;
      gtube(qx+ox,qz+oz,WATER_Y-1.4,0.16,WATER_Y+0.72,0.14,5,col(0x4b4034),col(0x6d5c48),null,false);
    }

  for(i=0;i<=n;i++){

/* rear service yard shared by shop / apt / ware blocks */
function rearYard(L,rng,face){
  var d=rng.range(4.5,7.5);
  var r=(face===0)?[L.x0+1.5,L.z1-d,L.x1-1.5,L.z1-0.6]:
       (face===2)?[L.x0+1.5,L.z0+0.6,L.x1-1.5,L.z0+d]:
       (face===1)?[L.x0+0.6,L.z0+1.5,L.x0+d,L.z1-1.5]:
                  [L.x1-d,L.z0+1.5,L.x1-0.6,L.z1-1.5];
  dumpsterAt((r[0]+r[2])*0.5,r[1]===L.z0+0.6?r[3]-1.4:r[1]+1.4,face===2?0:2,rng);
  for(var i=0;i<rng.int(1,3);i++)crateAt(rng.range(r[0]+1,r[2]-1),rng.range(r[1]+1,r[3]-1),rng);
  if(rng.chance(0.5))palletAt(rng.range(r[0]+1,r[2]-1),rng.range(r[1]+1,r[3]-1),rng);
  if(rng.chance(0.4))oilDrumAt(rng.range(r[0]+1,r[2]-1),rng.range(r[1]+1,r[3]-1),rng);
  driveway(r[0],r[1],r[2],r[3],rng);
  parkedAt((r[0]+r[2])*0.5,(r[1]+r[3])*0.5,face%2?Math.PI/2:0,3);
  return r;
}
/* perimeter fence with a gate gap on one face */
function yardFence(L,hgt,rng,gapFace){
  var x0=L.x0+0.35,z0=L.z0+0.35,x1=L.x1-0.35,z1=L.z1-0.35,m=6.5;
  var f=function(a,b,c,d){fenceRun(a,b,c,d,hgt,rng);};
  if(gapFace===2){f(x0,z0,x0+m,z0);f(x0+m+7,z0,x1,z0);}else f(x0,z0,x1,z0);
  if(gapFace===0){f(x0,z1,x0+m,z1);f(x0+m+7,z1,x1,z1);}else f(x0,z1,x1,z1);
  f(x0,z0,x0,z1);f(x1,z0,x1,z1);
}
function lotBuild(L,k,rng){
  switch(k){
    case 'tower':  lotTower(L,rng);break;
    case 'office': lotOffice(L,rng);break;
    case 'apt':    lotApt(L,rng);break;
    case 'shop':   lotShop(L,rng);break;
    case 'ware':   lotWare(L,rng);break;
    case 'lot':    lotParking(L,rng);break;
    case 'garage': lotGarage(L,rng);break;
    case 'plaza':  lotPlaza(L,rng);break;
    case 'park':   lotPark(L,rng);break;
    case 'bank':   lotBank(L,rng);break;
    case 'station':lotStation(L,rng);break;
    case 'rail':   lotRail(L,rng);break;
    case 'front':  lotFront(L,rng);break;
    case 'neon':   lotNeon(L,rng);break;
    default:       lotApt(L,rng);
  }
}
/* ------------------------------------------------------------ downtown */
function lotTower(L,rng){
  var cen=cenF(L),H=Math.max(16,Math.min(54,(1.12-cen)*38+rng.range(-4,7)));
  var pd=rng.range(2.4,4.6),pF=rng.int(2,4),pH=pF*CFG.FLOOR;
  var t1=fTile(rng),t2=fTile(rng,[T.GLASS_GREY,T.GLASS_GREY2,T.GLASS_BLUE,
    T.GLASS_BLUE2,T.PANEL,T.GLASS_GREY]);
  var c1=tintFor(rng,false),c2=tintFor(rng,true);
  var ry1=mass(L.x0,L.z0,L.x1,L.z1,LOT_Y,pH,t1,cmul(c1,0.8),c1,rng);
  var tx0=L.x0+pd,tx1=L.x1-pd,tz0=L.z0+pd,tz1=L.z1-pd;
  /* upper storeys step in once more above two thirds height */
  var hA=H*(rng.chance(0.45)?0.62:1),ry2;
  if(hA<H){
    ry2=mass(tx0,tz0,tx1,tz1,LOT_Y+pH,hA,t2,cmul(c2,0.74),c2,rng);
    var s=rng.range(1.2,2.2);
    mass(tx0+s,tz0+s,tx1-s,tz1-s,LOT_Y+pH+hA,H-hA,fTile(rng,[T.GLASS_BLUE,T.GLASS_GREY2,T.PANEL]),
         cmul(c2,0.68),cmul(c2,0.94),rng);
    roofKit(tx0+s,tz0+s,tx1-s,tz1-s,LOT_Y+pH+H,rng,false);
  }else{
    ry2=mass(tx0,tz0,tx1,tz1,LOT_Y+pH,H,t2,cmul(c2,0.74),c2,rng);
    roofKit(tx0,tz0,tx1,tz1,ry2,rng,true);
  }
  entrance(L.cx,L.z0,0,3.2,rng,true);
  if(rng.chance(0.7))entrance(L.cx,L.z1,2,2.4,rng,false);
  signBand(L.x0+1.5,L.z0,L.x1-1.5,L.z0,0,LOT_Y+pH-1.15,1.05,rng,TH.neon>0.4);
  /* podium roof deck: planters, condenser units, an ad panel over the street */
  var i;
  for(i=0;i<3;i++)planterAt(L.x0+2.5+i*rng.range(5,8),L.z0-2.6+i*0.4,rng);
  if(rng.chance(0.5))billboard(L.cx,L.z1-1.2,true,rng,rng.range(7,11),3.4,LOT_Y+pH+0.2);
  for(i=0;i<4;i++)treeAt(L.x0+3+i*rng.range(7,10),L.z0-2.0,rng);
  for(i=0;i<3;i++)treeAt(L.x0+4+i*rng.range(8,11),L.z1+2.0,rng);
  rearYard(L,rng,1);
  kerbProps(L,rng);pedRing(L,5,rng);
  plotAt('tower',L.cx,L.z0-1.8,L);
}
function lotOffice(L,rng){
  var cen=cenF(L),H=CFG.FLOOR*rng.int(3,Math.max(4,Math.round(13-cen*7)));
  var setback=rng.chance(0.35),c=tintFor(rng,true),t=fTile(rng);
  var ix=rng.range(1.2,3.2);
  var ry=mass(L.x0,L.z0,L.x1,L.z1,LOT_Y,H,t,cmul(c,0.78),c,rng);
  if(setback)mass(L.x0+ix,L.z0+ix,L.x1-ix,L.z1-ix,LOT_Y+H,H*rng.range(0.3,0.6),
                  fTile(rng,[T.GLASS_GREY,T.GLASS_BLUE2,T.PANEL]),cmul(c,0.7),cmul(c,0.95),rng);
  roofKit(L.x0,L.z0,L.x1,L.z1,ry,rng,true);
  entrance(L.cx,L.z0,0,3.0,rng,true);
  var f=faceInfo(L.x0,L.z0,L.x1,L.z1,0);
  cornice(f,LOT_Y+H-0.5,0.42,tileUV(T.STONE_BANK),cmul(c,0.72),cmul(c,1.06));
  var f2=faceInfo(L.x0,L.z0,L.x1,L.z1,2);
  cornice(f2,LOT_Y+H-0.5,0.42,tileUV(T.STONE_BANK),cmul(c,0.72),cmul(c,1.06));
  if(rng.chance(0.55))billboard(L.x1-3.5,L.cz,true,rng,8,3.0,ry+0.3);
  for(var i=0;i<4;i++)treeAt(L.x0+2.5+i*rng.range(6,9),L.z0-2.2,rng);
  for(i=0;i<2;i++)binAt(L.x0+1.6+i*7,L.z1+2.4,rng);

  kerbProps(L,rng);pedRing(L,5,rng);

/* ------------------------------------------------------------ residential */
function lotApt(L,rng){
  var th=TH.facade,t=fTile(rng,[T.BRICK_RED,T.BRICK_RED2,T.BRICK_BROWN,
    T.BRICK_BROWN2,T.APT_BLUE,T.APT_BLUE2,T.PLASTER,T.PANEL]);
  var floors=rng.int(2,5),H=floors*CFG.FLOOR+0.6;
  var c=tintFor(rng,false),d=rng.range(7.5,11.5);
  /* perimeter block with a courtyard: four wings, each its own mass */
  var w=0.1;
  mass(L.x0,L.z0,L.x1,L.z0+d,LOT_Y,H,t,cmul(c,0.8),c,rng);
  if(rng.chance(0.8))mass(L.x0,L.z1-d,L.x1,L.z1,LOT_Y,H,t,cmul(c,0.84),cmul(c,1.03),rng);
  else{
    var sw=(L.x1-L.x0)*rng.range(0.3,0.45);
    mass(L.x0,L.z1-d,L.x0+sw,L.z1,LOT_Y,H,t,cmul(c,0.84),cmul(c,1.03),rng);
    mass(L.x1-sw,L.z1-d,L.x1,L.z1,LOT_Y,H*0.9,t,cmul(c,0.8),c,rng);
  }
  mass(L.x0,L.z0+d,L.x0+d,L.z1-d,LOT_Y,H,t,cmul(c,0.76),cmul(c,0.98),rng);
  if(rng.chance(0.7))mass(L.x1-d,L.z0+d,L.x1,L.z1-d,LOT_Y,H,t,cmul(c,0.79),cmul(c,1.0),rng);
  else{
    var g2=rng.range(4,7);
    mass(L.x1-d,L.z0+d,L.x1,L.z0+d+g2,LOT_Y,H,t,cmul(c,0.79),cmul(c,1.0),rng);
    mass(L.x1-d,L.z1-d-g2,L.x1,L.z1-d,LOT_Y,H,t,cmul(c,0.77),cmul(c,0.99),rng);
    var gy=rng.range(5.5,8);
    useCity(L.x1-d*0.5,(L.z0+L.z1)*0.5);
    gfill(L.x1-d,L.z0+d+g2,L.x1,L.z1-d-g2,SIDE_Y+0.01,T.GRASS,col(0xf0f5e6),{rng:rng,jit:0.08});
    for(var q=0;q<2;q++)treeAt(L.x1-d*0.5,L.z0+d+g2+gy*(q+0.5),rng);
  }
  /* ground-floor shopfronts on the street face, flats above */
  var frontZ=L.z0+d;
  signBand(L.x0+0.4,L.z0,L.x1-0.4,L.z0,0,LOT_Y+0.15,1.35,rng,TH.neon>0.5);
  var n=rng.int(2,4),bays=(L.x1-L.x0)/n;
  for(var i=0;i<n;i++){
    var bx=L.x0+bays*(i+0.5);
    if(i===rng.int(0,n-1))entrance(bx,frontZ,0,2.0,rng,false);
    else if(rng.chance(0.6))awning(L.x0+bays*i,frontZ,L.x0+bays*(i+1),frontZ,0,
          LOT_Y+3.0,rng.range(1.5,2.3),col(i%2?0xb8453a:0x2f6b86),
          col(i%2?0xe8ddd0:0xe8ddd0),6);
  }
  entrance(L.cx,L.z1-d,2,2.2,rng,false);
  if(floors>2){
    fireEscape((L.x0+L.x1)*0.5-L.z0*0,L.z0,0,0,0,0,rng);
  }
  if(floors>2){
    fireEscape(L.x0,L.z0,L.x1,L.z1,3,floors,rng);
    if(rng.chance(0.6))fireEscape(L.x0,L.z0,L.x1,L.z1,1,floors,rng);
  }
  /* courtyard */
  var cx0=L.x0+d+0.4,cz0=L.z0+d+0.4,cx1=L.x1-d-0.4,cz1=L.z1-d-0.4;
  if(cx1-cx0>4&&cz1-cz0>4){
    useCity((cx0+cx1)*0.5,(cz0+cz1)*0.5);
    gfill(cx0,cz0,cx1,cz1,LOT_Y+0.01,T.GRASS,col(0xf2f6ea),{rng:rng,jit:0.09});
    gfill((cx0+cx1)*0.5-1.1,cz0,(cx0+cx1)*0.5+1.1,cz1,SIDE_Y+0.02,T.BRICK_ROUND,
          col(0xe8e2d6),{rng:rng,jit:0.05});
    useCut((cx0+cx1)*0.5,(cz0+cz1)*0.5);
    gfill(cx0,cz0,cx1,cz0+0.02,LOT_Y+0.02,T.WHITE,WHITE,{});
    for(i=0;i<rng.int(2,4);i++)treeAt(rng.range(cx0+1,cx1-1),rng.range(cz0+1,cz1-1),rng);
    for(i=0;i<2;i++)shrubAt(rng.range(cx0+1,cx1-1),rng.range(cz0+1,cz1-1),rng);
    benchAt((cx0+cx1)*0.5,cz0+1.6,0,rng);
    binAt(cx0+1.4,cz1-1.4,rng);
    tyreStackAt(rng.range(cx0+1.5,cx1-1.5),rng.range(cz0+1.5,cz1-1.5),rng);
    CITY.C.add(cx0,cz0,cx1,cz0,'');
    CITY.C.rects.length&&0;
  }
  rearYard(L,rng,1);
  kerbProps(L,rng);pedRing(L,6,rng);
  parkedAt(L.sx1-1.6,L.sz1-6.0,Math.PI/2,1);
  parkedAt(L.sx1-1.6,L.sz1-11.0,Math.PI/2,2);
  plotAt('apt',L.cx,L.z0-1.6,L);
}

function lotParking(L,rng){
  var x0=L.x0+0.5,z0=L.z0+0.5,x1=L.x1-0.5,z1=L.z1-0.5,mx=(x0+x1)*0.5,mz=(z0+z1)*0.5;
  var vertical=rng.chance(0.5),levels=rng.int(1,3),i;
  /* light masts + perimeter kerb fence */
  for(i=0;i<4;i++){
    var px=i%2?x1-1.6:x0+1.6,pz=i<2?z0+1.6:z1-1.6;
    useCity(px,pz);
    gtube(px,pz,LOT_Y,0.13,7.2,0.08,6,col(0x4e5359),col(0x7c8288),null,false);
    gbox(px-0.55,pz-0.28,px+0.55,pz+0.28,7.2,7.45,tileUV(T.METAL_RIB),col(0x3f4348),col(0x666c72));
    flat(px-0.45,pz-0.2,px+0.45,pz+0.2,7.19,TH.night?col(0xffe9c0):col(0xa9afb5));
    CITY.C.add(px-0.16,pz-0.16,px+0.16,pz+0.16,2,'prop');

  /* bays */
  var bw=2.75,cl=5.4,line=col(0xf0efe4),rows=Math.floor((vertical?z1-z0:x1-x0)/(cl*2));
  rows=Math.max(1,rows);
  var along=vertical;   /* cars nose-in from aisles running along the other axis */
  useProp(mx,mz);
  var step=(vertical?x1-x0:z1-z0)/Math.max(1,Math.floor((vertical?x1-x0:z1-z0)/(bw*2)));
  for(var r0=0;r0<rows;r0++){
    var base=vertical?z0+cl*r0+1.0:z0+1.0;
    var ay=vertical?base:z0+ (r0+0.5)*((z1-z0)/rows);
    for(var side=0;side<2;side++){
      if(vertical){
        var zz=base+side*(cl-0.35);
        if(zz>z1-1)continue;
        var n=Math.floor((x1-x0-2)/bw);
        for(i=0;i<n;i++){
          var bx0=x0+1+i*bw;
          if((i%4)===3)continue;                      /* fire lane gap */
          flat(bx0+0.06,zz,bx0+bw-0.06,zz+(side?-1:1)*4.6,LOT_Y+0.012,line,T.WHITE);
          if(rng.chance(0.42))parkedAt(bx0+bw*0.5,zz+(side?-1:1)*2.3,Math.PI/2,rng.int(0,5));
        }
      }else{
        var xx=base+side*(cl-0.35);
        if(xx>x1-1)continue;
        var m=Math.floor((z1-z0-2)/bw);
        for(i=0;i<m;i++){
          var bz0=z0+1+i*bw;
          if((i%5)===4)continue;
          flat(xx,bz0+0.06,xx+(side?-1:1)*4.6,bz0+bw-0.06,LOT_Y+0.012,line,T.WHITE);
          if(rng.chance(0.42))parkedAt(xx+(side?-1:1)*2.3,bz0+bw*0.5,0,rng.int(0,5));
        }
      }
    }
  }
  /* aisle arrows + speed humps */
  useProp(mx,mz);
  if(vertical)flat(x0+1,(z0+z1)*0.5-1.2,x1-1,(z0+z1)*0.5+1.2,LOT_Y+0.011,col(0xd8d6c8),T.WHITE);
  else flat((x0+x1)*0.5-1.2,z0+1,(x0+x1)*0.5+1.2,z1-1,LOT_Y+0.011,col(0xd8d6c8),T.WHITE);
  /* pay booth + payment machine + clutter */
  var bhx=mx-1.6,bhz=mz+1.2;
  if(rng.chance(0.6)){
    var ry=mass(bhx-1.4,bhz-1.4,bhx+1.4,bhz+1.4,LOT_Y,2.6,T.CONCRETE_BLK,
                col(0x6f7069),col(0x9a9b92),rng,T.ROOF_TAR,true);
    windowBox(bhx,bhz-1.4,0,1.4,1.0);
    entrance(bhx,bhz+1.4,2,1.5,rng,false);
  }
  if(rng.chance(0.5))tyreStackAt(x1-2.0,z1-2.0,rng);
  if(rng.chance(0.5))oilDrumAt(x0+1.8,z1-1.8,rng);
  if(rng.chance(0.45))dumpsterAt(x1-2.2,z0+2.0,0,rng);
  if(rng.chance(0.35))palmAt(mx+6,mz-5,rng);
  if(TH.palms>0.4)for(i=0;i<3;i++)palmAt(x0+2+i*10,z1-2,rng);
  else for(i=0;i<2;i++)treeAt(x0+3+i*12,z1-2,rng);
  yardFence(L,1.9,rng,2);
  for(i=0;i<2;i++)parkedAt(x0+3+i*5.5,z0+1.4,0,3);
  kerbProps(L,rng);pedRing(L,3,rng);
  plotAt('lot',mx,L.z0-1.6,L);

  gfill(mx-1.6,z0,mx+1.6,z1,SIDE_Y+0.02,T.BRICK_ROUND,col(0xece6da),{rng:rng,jit:0.05});
  gfill(x0,mz-1.6,x1,mz+1.6,SIDE_Y+0.02,T.BRICK_ROUND,col(0xece6da),{rng:rng,jit:0.05});
  gfill(x0+0.6,z0+0.6,x1-0.6,z0+2.6,SIDE_Y+0.01,T.SIDEWALK_TILE,col(0xf2f2ec),{rng:rng,jit:0.04});
  gfill(x0+0.6,z1-2.6,x1-0.6,z1-0.6,SIDE_Y+0.01,T.SIDEWALK_TILE,col(0xf2f2ec),{rng:rng,jit:0.04});
  /* pond or fountain, bandstand, kiosk */

    waterArea(px-pr,pz-pr,px+pr,pz+pr,LOT_Y-0.05,WHITE);

    gcyl(px,pz,LOT_Y-0.2,0.3,pr+0.5,18,col(0x6f6d64),col(0x9b978c),tileUV(T.STONE_PLAZA),false);
    for(i=0;i<3;i++){
      var a=rng.f()*TAU;
      treeAt(px+Math.cos(a)*(pr+2.4),pz+Math.sin(a)*(pr+2.4),rng);
    }
    CITY.C.add(px-pr,pz-pr,px+pr,pz+pr,1,'water');
    for(i=0;i<4;i++)benchAt(px+Math.cos(i/4*TAU)*(pr+2.0),pz+Math.sin(i/4*TAU)*(pr+2.0),i%4,rng);
  }else fountainAt(mx,mz,rng.range(2.4,3.4),rng);
  if(rng.chance(0.5)){
    var bx=mx-9,bz=mz+8;

    for(i=0;i<seg;i++){
      var a=i/seg*TAU,a2=(i+1)/seg*TAU;
      gbox(bx+Math.cos(a)*rr-0.16,bz+Math.sin(a)*rr-0.16,
           bx+Math.cos(a2)*rr+0.16,bz+Math.sin(a2)*rr+0.16,LOT_Y+0.02,LOT_Y+2.1,
           tileUV(T.WOOD),col(0x6c5b45),col(0x96805f));
    }
    gfill(bx-rr,bz-rr,bx+rr,bz+rr,LOT_Y+2.1,T.WOOD,col(0x9b8867),{rng:rng,jit:0.05});
    var pts=ringPtsLocal(bx,bz,rr+1.1,seg);
    gextr(pts,LOT_Y+2.1,pts,LOT_Y+3.2,tileUV(T.ROOF_TAR),col(0x5c5148),col(0x7d6f60),{});
    for(i=0;i<seg;i++){
      var a3=i/seg*TAU;
      gpole(bx+Math.cos(a3)*rr,bz+Math.sin(a3)*rr,LOT_Y+2.1,1.1,0.07,4,col(0x7d6f60));
    }
    aoBlob(bx-rr-1,bz-rr-1,bx+rr+1,bz+rr+1,1.4);
    CITY.C.add(bx-rr,bz-rr,bx+rr,bz+rr,LOT_Y+2.1,'prop');
  }
  if(rng.chance(0.6))kioskAt(mx+7,mz-6,rng);
  /* trees, hedges, benches, bins */
  for(i=0;i<rng.int(10,18);i++){
    var tx=rng.range(x0+2,x1-2),tz=rng.range(z0+2,z1-2);
    if(Math.abs(tx-mx)<2.6||Math.abs(tz-mz)<2.6)continue;
    treeAt(tx,tz,rng);
  }
  for(i=0;i<rng.int(3,6);i++)shrubAt(rng.range(x0+2,x1-2),rng.range(z0+2,z1-2),rng);
  for(i=0;i<6;i++){
    var t=i/6;
    benchAt(x0+2+(x1-x0-4)*t,z0+3.4,0,rng);
    benchAt(x0+2+(x1-x0-4)*t,z1-3.4,2,rng);
  }
  for(i=0;i<4;i++)binAt(i%2?x1-2.4:x0+2.4,mz+(i<2?-8:8),rng);
  /* dog / dog-walker style clutter */
  if(rng.chance(0.5))hydrantAt(x0+2.0,mz+3);
  kerbProps(L,rng);pedRing(L,9,rng);
  for(i=0;i<3;i++)pedAt(mx+(i-1)*6,mz+5);
  plotAt('park',mx,L.z0-1.6,L);
}
function ringPtsLocal(cx,cz,r,seg){
  var p=[];
  for(var i=0;i<seg;i++){var a=i/seg*TAU;p.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r]);}
  return p;
}

  for(i=0;i<4;i++)binAt(mx+(i%2?11:-11),mz+(i<2?-11:11),rng);

    var ry=mass(x0,z1-7.5,x1,z1,LOT_Y,CFG.FLOOR*2,fTile(rng),cmix(WHITE,col(0xa8a29a),0.3),
                col(0xd8d4ca),rng);
    roofKit(x0,z1-7.5,x1,z1,ry,rng,false);

    for(i=0;i<4;i++)entrance(x0+(i+0.5)*(x1-x0)/4,z1-7.5,2,2.2,rng,false);
  }

  for(i=0;i<4;i++)pedAt(mx+(i-1.5)*7,mz+4);

       cmul(c,0.76),cmix(c,WHITE,0.3));

  useCity((x0+x1)*0.5,z0-2);
  gfill(x0-0.4,z0-3.0,x1+0.4,z0-1.0,LOT_Y+H+0.5,T.STONE_BANK2,col(0xb7b0a2),{rng:rng,jit:0.04});
  roofKit(x0,z0,x1,z1,ry,rng,false);

  for(i=0;i<4;i++)if(TH.palms>0.4)palmAt(L.x0+3+i*8,L.z0-3.4,rng);

function railTrack(x1,z1,x2,z2,gauge,rng){
  var mx=(x1+x2)*0.5,mz=(z1+z2)*0.5,dx=x2-x1,dz=z2-z1,l=len2(dx,dz)||1;
  var ux=dx/l,uz=dz/l,px=-uz,pz=ux;
  useCity(mx,mz);
  gstrip(x1,z1,x2,z2,gauge+3.4,LOT_Y-0.02,tileUV(T.GRAVEL),col(0xf0efe6),0);
  var n=Math.max(2,Math.round(l/1.9));
  for(var i=0;i<n;i++){
    var t=(i+0.5)/n,sx=x1+dx*t,sz=z1+dz*t;
    useProp(sx,sz);
    gstrip(sx+px*(gauge*0.5+0.1),sz+pz*(gauge*0.5+0.1),
           sx-px*(gauge*0.5+0.1),sz-pz*(gauge*0.5+0.1),0.28,LOT_Y+0.06,tileUV(T.WOOD),col(0x5f4c37));
  }
  for(var s=-1;s<=1;s+=2){
    useCity(mx,mz);
    gstrip(x1+px*gauge*0.5*s,z1+pz*gauge*0.5*s,x2+px*gauge*0.5*s,z2+pz*gauge*0.5*s,
           0.14,LOT_Y+0.16,tileUV(T.METAL),col(0x9aa0a6));
    gstrip(x1+px*gauge*0.5*s,z1+pz*gauge*0.5*s,x2+px*gauge*0.5*s,z2+pz*gauge*0.5*s,
           0.24,LOT_Y+0.13,tileUV(T.METAL),col(0x54595f));
  }
  CITY.C.add(Math.min(x1,x2)-0.5,Math.min(z1,z2)-0.5,
             Math.max(x1,x2)+0.5,Math.max(z1,z2)+0.5,0.12,'rail');
}
function wagonAt(x,z,yaw,rng,len,c2){
  var L=len||rng.range(9,13),W=2.9,ca=Math.abs(Math.cos(yaw))>0.7;
  var hx=ca?L*0.5:W*0.5,hz=ca?W*0.5:L*0.5;
  useCity(x,z);
  gbox(x-hx,z-hz,x+hx,z+hz,LOT_Y+0.35,LOT_Y+0.62,tileUV(T.METAL_RIB),col(0x2f3337),col(0x4d5257));
  var body=col(c2===undefined?rng.chance(0.5)?0x6b4032:0x4a5a6b:c2);
  gbox(x-hx,z-hz,x+hx,z+hz,LOT_Y+0.62,LOT_Y+3.1,tileUV(T.CARGO),cmul(body,0.72),body);
  gbox(x-hx*1.01,z-hz*1.01,x+hx*1.01,z+hz*1.01,LOT_Y+3.1,LOT_Y+3.28,tileUV(T.METAL),
       cmul(body,0.6),cmul(body,1.06));
  for(var i=0;i<3;i++){
    var u=-1+i;
    var wx=ca?x+u*L*0.33:x,wz=ca?z:z+u*L*0.33;
    gcyl(wx,wz,LOT_Y+0.2,0.42,0.42,10,col(0x24272b),col(0x3c4045),null,true);
  }
  aoBlob(x-hx*1.2,z-hz*1.6,x+hx*1.2,z+hz*1.6,1.0);
  CITY.C.add(x-hx,z-hz,x+hx,z+hz,LOT_Y+3.3,'building');
}
function lotRail(L,rng){
  var zc=L.cz,along=true;
  var x0=CFG.MIN(L.bx),x1=CFG.MAX(L.bx),z0=L.z0-1.2,z1=L.z1+1.2;
  /* ballast berm running east-west the whole length of the block */
  useCity(L.cx,zc);
  gfill(x0,z0,x1,z1,LOT_Y-0.02,T.GRAVEL,col(0xf1f0e7),{rng:rng,jit:0.07});
  railTrack(x0,zc-2.6,x1,zc-2.6,1.6,rng);
  if(rng.chance(0.65))railTrack(x0,zc+2.8,x1,zc+2.8,1.6,rng);
  /* a parked consist, sometimes a hopper pair */
  var nx=rng.int(1,3);
  for(var i=0;i<nx;i++)wagonAt(L.cx-6+i*11.5,zc-2.6,0,rng);
  if(rng.chance(0.4)&&rng.chance(1)){
    wagonAt(L.cx+4,zc+2.8,0,rng,rng.range(10,14),0x7a5a3a);
  }
  /* service road, sheds, telegraph poles */
  var sy=L.z1-2.6;
  useCity(L.cx,sy);
  gfill(x0,sy-1.6,x1,sy+1.6,SIDE_Y+0.01,T.ASPHALT_DARK,col(0xf0f0ec),{rng:rng,jit:0.06});
  for(i=0;i<3;i++){
    var px=L.x0+3+i*rng.range(10,15);

    var ry=mass(px,sy-4.2,px+rng.range(6,10),sy-0.6,LOT_Y,rng.range(3.4,5.2),
                fTile(rng,[T.WAREHOUSE,T.METAL,T.BRICK_BROWN]),col(0x7d7a72),col(0xa5a29a),rng,
                TH.roof[rng.int(0,2)],true);
    if(rng.chance(0.5))containerAt(px+3,sy+2.6,0,rng,i);
  }
  for(i=0;i<4;i++){
    var tx=L.x0+2+i*rng.range(9,13);
    if(tx>L.x1-2)break;
    useCity(tx,zc-6.0);
    gtube(tx,zc-6.0,LOT_Y,0.11,5.6,0.08,6,col(0x5c5347),col(0x84796a),null,false);
    gstrip(tx-1.5,zc-6.0,tx+1.5,zc-6.0,0.12,5.3,tileUV(T.WOOD),col(0x6b5f4f));
    CITY.C.add(tx-0.14,zc-6.14,tx+0.14,zc-5.86,3,'prop');
  }
  for(i=0;i<3;i++)crateAt(rng.range(x0+2,x1-2),rng.range(z0+1.5,z0+3.5),rng);
  if(rng.chance(0.6))oilDrumAt(rng.range(x0+2,x1-2),sy-5.0,rng);
  /* fence the corridor, gaps where the streets touch it */
  fenceRun(x0,z1,x1,z1,2.2,rng);
  fenceRun(x0,z0,x1,z0,2.2,rng);
  kerbProps(L,rng);pedRing(L,3,rng);
  parkedAt(L.cx,sy,L.z0<sy?0:Math.PI,4);
  plotAt('rail',L.cx,zc,L);
}
function lotStation(L,rng){
  var x0=L.x0+1.0,z0=L.z0+0.8,x1=L.x1-1.0,z1=L.z1-0.8,cx=L.cx,cz=L.cz;
  var i;
  useCity(cx,cz);
  gfill(x0,z0,x1,z1,LOT_Y,T.PLATFORM,col(0xf3f2ea),{rng:rng,jit:0.05});
  /* train shed: two tracks under a long canopy */
  var ty1=L.z0+6.0,ty2=L.z0+11.0;
  railTrack(x0,ty1,x1,ty1,1.6,rng);
  railTrack(x0,ty2,x1,ty2,1.6,rng);
  wagonAt(L.cx-5,ty1,0,rng,12,0x8a5f3c);
  wagonAt(L.cx+7.5,ty1,0,rng,12,0x6b7a4a);
  if(rng.chance(0.5))wagonAt(L.cx+2,ty2,0,rng,11,0x4a5a6b);
  /* platforms either side of the tracks */
  var pfs=[[L.z0+2.0,ty1-2.2],[ty1+2.2,ty2-2.2],[ty2+2.2,L.z1-2.0]];
  for(i=0;i<pfs.length;i++){

         col(0x6e6f68),col(0x999a91));
    gbox(x0,pfs[i][1]-0.3,x1,pfs[i][1],LOT_Y,LOT_Y+0.42,tileUV(T.CONCRETE_BLK),
         col(0x6a6b64),col(0x95968d));
    CITY.C.add(x0,pfs[i][0],x1,pfs[i][1],LOT_Y+0.42,'platform');
    useProp(cx,(pfs[i][0]+pfs[i][1])*0.5);
    flat(x0+1,pfs[i][1]-0.75,x1-1,pfs[i][1]-0.65,LOT_Y+0.43,col(0xd8b23a),T.WHITE);
    /* platform furniture */
    for(var k=0;k<4;k++){
      var bx2=x0+3+(x1-x0-6)*k/3,bz2=(pfs[i][0]+pfs[i][1])*0.5;
      if(i===1){
        benchAt(bx2,bz2-1.4,0,rng);
        useCity(bx2,bz2+1.4);
        gbox(bx2-0.55,bz2+1.1,bx2+0.55,bz2+1.6,LOT_Y+0.42,LOT_Y+1.62,tileUV(T.METAL),
             col(0x40454b),col(0x666c72));
        CITY.C.add(bx2-0.55,bz2+1.1,bx2+0.55,bz2+1.6,1.6,'prop');
      }else benchAt(bx2,bz2+1.2,2,rng);
      if(k===1)binAt(bx2+1.8,bz2,rng);
    }
  }
